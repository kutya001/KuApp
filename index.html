<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KuApp</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0f">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Manrope:wght@400;500;600;700;800&display=swap');

        /* ── TOKENS ── */
        :root {
            --bg:#0b0d14;--surface:#131622;--surface-2:#1a1e2d;--surface-3:#232839;
            --border:rgba(255,255,255,0.06);--border-hi:rgba(255,255,255,0.12);
            --text:#f2f3fa;--text-2:#9aa0b8;--text-3:#5c6280;
            --c-work:#22d3a6;--c-rest:#ff8c42;--c-prep:#6d8dff;--c-finish:#ffd166;--c-danger:#ff5470;
            --accent:var(--c-prep);--accent-2:var(--c-work);
            --grad:linear-gradient(135deg,#6d8dff 0%,#22d3a6 100%);
            --accent-soft:rgba(109,141,255,.14);--accent-line:rgba(109,141,255,.28);
            --radius:18px;--radius-sm:12px;--radius-xs:8px;--header-h:60px;
            --shadow:0 12px 32px rgba(0,0,0,.35);--shadow-sm:0 4px 14px rgba(0,0,0,.25);
            --glass:rgba(19,22,34,.72);
        }
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        html{-webkit-text-size-adjust:100%}
        body{font-family:'Manrope',sans-serif;background:
            radial-gradient(1100px 560px at 8% -12%,rgba(109,141,255,.16),transparent 60%),
            radial-gradient(900px 520px at 108% 8%,rgba(34,211,166,.10),transparent 60%),
            var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden;line-height:1.45}
        button{font-family:inherit}
        :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

        /* ── VIEWS ── */
        .view{display:none;flex:1;overflow:hidden;flex-direction:column}.view.active{display:flex}

        /* ── AUTH SCREENS ── */
        .auth-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px}
        .auth-card{width:100%;max-width:420px;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015)),var(--surface);border:1px solid var(--border-hi);border-radius:24px;padding:32px 26px 26px;display:flex;flex-direction:column;gap:20px;box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
        .auth-logo{text-align:center;display:flex;flex-direction:column;align-items:center}
        .auth-logo-icon{width:68px;height:68px;border-radius:20px;background:var(--grad);display:grid;place-items:center;margin-bottom:14px;box-shadow:0 10px 24px rgba(109,141,255,.35)}
        .auth-logo-icon svg{width:36px;height:36px;stroke:#0b0d14!important}
        .auth-logo-name{font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
        .auth-logo-sub{font-size:.8rem;color:var(--text-2);margin-top:4px}
        .inp-group{display:flex;flex-direction:column;gap:6px}
        .inp-label{font-size:.74rem;color:var(--text-2);font-weight:700;letter-spacing:.02em}
        .inp-field{width:100%;padding:12px 14px;background:var(--surface-2);border:1px solid var(--border-hi);border-radius:var(--radius-sm);color:var(--text);font-family:'Manrope',sans-serif;font-size:.92rem;outline:none;transition:border-color .15s,box-shadow .15s}
        .inp-field::placeholder{color:var(--text-3)}
        .inp-field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
        .inp-code{font-family:'JetBrains Mono',monospace;font-size:1.5rem;letter-spacing:.4em;text-align:center;padding:14px;text-indent:.4em}
        .inp-ta{resize:vertical;min-height:90px;font-family:'JetBrains Mono',monospace;font-size:.72rem;line-height:1.5}
        .btn-primary{width:100%;padding:13px;background:var(--grad);color:#0b0d14;border:none;border-radius:var(--radius-sm);font-family:'Manrope',sans-serif;font-weight:800;font-size:.92rem;cursor:pointer;transition:transform .12s,filter .15s,box-shadow .15s;box-shadow:0 8px 20px rgba(109,141,255,.28)}
        .btn-primary:hover{filter:brightness(1.06)}
        .btn-primary:active{transform:scale(.985)}
        .btn-secondary{width:100%;padding:12px;background:var(--surface-2);border:1px solid var(--border-hi);color:var(--text);border-radius:var(--radius-sm);font-family:'Manrope',sans-serif;font-weight:700;font-size:.9rem;cursor:pointer;transition:background .15s,border-color .15s}
        .btn-secondary:hover{background:var(--surface-3);border-color:var(--accent-line)}
        .auth-err{font-size:.8rem;color:var(--c-danger);min-height:18px}
        .auth-link{font-size:.8rem;color:var(--accent);cursor:pointer;background:none;border:none;font-family:'Manrope',sans-serif;text-align:center}
        .auth-link:hover{text-decoration:underline}
        .auth-sep{height:1px;background:var(--border)}
        .auth-hints{display:grid;grid-template-columns:1fr 1fr;gap:8px}
        .auth-hint{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm)}
        .auth-hint-ico{font-size:1.1rem;line-height:1.2}
        .auth-hint b{display:block;font-size:.74rem;color:var(--text)}
        .auth-hint span{font-size:.66rem;color:var(--text-2);line-height:1.4}
        .auth-note{font-size:.7rem;color:var(--text-3);text-align:center;line-height:1.5}

        /* ── PLATFORM LAYOUT ── */
        .plat-layout{display:flex;flex:1;overflow:hidden}
        .sidebar{display:none;width:240px;flex-shrink:0;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-right:1px solid var(--border);flex-direction:column}
        .side-brand{padding:18px 18px 14px;font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
        .side-brand-icon{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;box-shadow:0 6px 16px rgba(109,141,255,.3);font-size:1rem}
        .side-brand-icon svg{width:18px;height:18px;stroke:#0b0d14!important}
        .side-nav{flex:1;padding:6px 10px;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
        .side-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--radius-sm);border:none;background:none;color:var(--text-2);font:inherit;font-size:.86rem;font-weight:600;cursor:pointer;transition:background .15s,color .15s;text-align:left;width:100%;position:relative}
        .side-item:hover{background:rgba(255,255,255,.04);color:var(--text)}
        .side-item.active{background:var(--accent-soft);color:#fff}
        .side-item.active::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--grad)}
        .side-item .ico{width:24px;height:24px;display:grid;place-items:center;flex-shrink:0;color:var(--text-3)}
        .side-item.active .ico,.side-item:hover .ico{color:var(--accent)}
        .side-sep{height:1px;background:var(--border);margin:8px 12px}
        .side-footer{padding:12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
        .side-user{flex:1;font-size:.8rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .avatar{width:36px;height:36px;border-radius:12px;background:var(--grad);color:#0b0d14;display:grid;place-items:center;font-weight:800;font-size:.9rem;flex-shrink:0;letter-spacing:-.02em}
        .avatar.guest{background:var(--surface-3);color:var(--text-2);border:1px solid var(--border-hi)}
        .avatar.sm{width:30px;height:30px;border-radius:10px;font-size:.78rem}

        .plat-main{display:flex;flex-direction:column;flex:1;overflow:hidden;min-width:0}
        .plat-header{display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);flex-shrink:0;height:var(--header-h);z-index:10;padding-top:env(safe-area-inset-top)}
        .plat-title{flex:1;font-size:1.05rem;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .hdr-userchip{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);cursor:pointer;max-width:170px}
        .hdr-user{font-size:.76rem;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .btn-icon{width:38px;height:38px;border-radius:var(--radius-sm);border:1px solid var(--border-hi);background:var(--surface-2);color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,color .15s,border-color .15s}
        .btn-icon:hover{background:var(--surface-3);color:var(--text);border-color:var(--accent-line)}
        .btn-icon svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

        /* ── TAB PANELS ── */
        .tab-panel{display:none;flex:1;overflow:hidden;flex-direction:column}
        .tab-panel.active{display:flex}
        .tab-scroll{flex:1;overflow-y:auto;padding:0 0 24px}

        /* ── BOTTOM NAV (mobile) ── */
        .bnav{display:flex;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border);flex-shrink:0;padding:6px 6px;padding-bottom:max(6px,env(safe-area-inset-bottom))}
        .bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--text-3);font-size:.6rem;font-weight:700;font-family:inherit;padding:4px 0 2px;cursor:pointer;transition:color .2s;letter-spacing:.01em}
        .bnav-item .ico{width:44px;height:28px;display:grid;place-items:center;border-radius:10px;transition:background .2s}
        .bnav-item .ico svg{width:20px;height:20px}
        .bnav-item.active{color:var(--accent)}
        .bnav-item.active .ico{background:var(--accent-soft)}

        @media(min-width:768px){
            .sidebar{display:flex}
            .bnav{display:none}
            .mob-only{display:none!important}
        }
        @media(min-width:1200px){
            .sidebar{width:264px}
        }

        /* ── APPS: SEARCH, CHIPS, HERO, GRID ── */
        .apps-top{padding:12px 16px 10px;display:flex;flex-direction:column;gap:10px;flex-shrink:0;border-bottom:1px solid var(--border);background:rgba(19,22,34,.4)}
        .search-input-wrap{position:relative;width:100%;display:flex;align-items:center}
        .search-input{width:100%;padding:11px 36px 11px 40px;background:var(--surface-2);border:1px solid var(--border-hi);border-radius:999px;color:var(--text);font-family:'Manrope',sans-serif;font-size:.88rem;outline:none;background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='15' height='15' viewBox='0 0 24 24' fill='none' stroke='%239aa0b8' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='11' cy='11' r='8'/%3E%3Cline x1='21' y1='21' x2='16.65' y2='16.65'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:14px center;transition:border-color .15s,box-shadow .15s}
        .search-input::placeholder{color:var(--text-3)}
        .search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
        .search-input::-webkit-search-cancel-button{display:none}
        .search-clear-btn{position:absolute;right:8px;width:26px;height:26px;border-radius:50%;background:var(--surface-3);border:none;color:var(--text-2);font-size:12px;cursor:pointer;display:none;align-items:center;justify-content:center;transition:color .15s,background .15s}
        .search-clear-btn:hover{color:var(--text);background:var(--border-hi)}
        .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:1px 0 2px}
        .chips::-webkit-scrollbar{display:none}
        .chip{flex-shrink:0;padding:7px 14px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);font-size:.76rem;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap}
        .chip:hover{border-color:var(--accent-line);color:var(--text)}
        .chip.active{background:var(--grad);color:#0b0d14;border-color:transparent;box-shadow:0 6px 16px rgba(109,141,255,.25)}

        #apps-scroll{flex:1;overflow-y:auto;padding:14px 16px 28px}
        .hero{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:var(--radius);background:linear-gradient(135deg,rgba(109,141,255,.20),rgba(34,211,166,.10)),var(--surface);border:1px solid var(--accent-line);margin-bottom:18px;position:relative;overflow:hidden;box-shadow:var(--shadow-sm)}
        .hero::after{content:'';position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,166,.25),transparent 70%);pointer-events:none}
        .hero .avatar{width:46px;height:46px;border-radius:14px;font-size:1.1rem}
        .hero-body{flex:1;min-width:0}
        .hero-title{font-size:1rem;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .hero-sub{font-size:.74rem;color:var(--text-2);margin-top:2px;line-height:1.4}
        .hero-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
        .badge{display:inline-flex;align-items:center;gap:4px;font-size:.62rem;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-3);color:var(--text-2);border:1px solid var(--border);white-space:nowrap}
        .badge.net{background:rgba(34,211,166,.14);color:var(--c-work);border-color:rgba(34,211,166,.3)}
        .badge.xp{background:rgba(255,209,102,.12);color:var(--c-finish);border-color:rgba(255,209,102,.3)}
        .badge.admin{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
        .badge.time{font-weight:600;font-family:'JetBrains Mono',monospace;font-size:.58rem}
        .hero-cta{flex-shrink:0;padding:10px 16px;border-radius:999px;background:var(--grad);color:#0b0d14;border:none;font-weight:800;font-size:.8rem;cursor:pointer;box-shadow:0 8px 18px rgba(109,141,255,.3);transition:transform .12s,filter .15s;position:relative}
        .hero-cta:hover{filter:brightness(1.06)}.hero-cta:active{transform:scale(.97)}

        .app-category{margin-bottom:22px}
        .app-cat-label{display:flex;align-items:center;gap:8px;font-size:.84rem;font-weight:800;color:var(--text);padding:0 2px 10px;letter-spacing:-.01em}
        .app-cat-count{font-size:.62rem;font-weight:700;color:var(--text-3);background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:1px 8px;font-family:'JetBrains Mono',monospace}
        .apps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
        .app-tile{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface-2);border:1px solid var(--border);border-radius:16px;padding:12px;cursor:pointer;transition:background .15s,border-color .15s,transform .12s,box-shadow .15s;user-select:none;position:relative;overflow:hidden;min-height:76px}
        .app-tile::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(109,141,255,.08),transparent 60%);opacity:0;transition:opacity .2s}
        .app-tile:hover{border-color:var(--accent-line);transform:translateY(-2px);box-shadow:var(--shadow-sm)}
        .app-tile:hover::before{opacity:1}
        .app-tile:active{transform:scale(.985)}
        .app-tile-icon{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:1.7rem;line-height:1;background:linear-gradient(135deg,rgba(255,255,255,.09),rgba(255,255,255,.02));border:1px solid var(--border-hi);flex-shrink:0;position:relative}
        .app-tile-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
        .app-tile-name{font-size:.9rem;font-weight:800;color:var(--text);line-height:1.25;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .app-tile-desc{font-size:.7rem;color:var(--text-2);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .app-tile-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px;min-height:0}
        .app-tile-arrow{color:var(--text-3);flex-shrink:0;transition:color .15s,transform .15s}
        .app-tile:hover .app-tile-arrow{color:var(--accent);transform:translateX(2px)}
        .app-tile-arrow svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

        .recent-row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px;margin:0 -2px}
        .recent-row::-webkit-scrollbar{display:none}
        .recent-card{flex:0 0 auto;width:112px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 8px 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:16px;cursor:pointer;text-align:center;transition:border-color .15s,transform .12s;user-select:none}
        .recent-card:hover{border-color:var(--accent-line);transform:translateY(-2px)}
        .recent-card:active{transform:scale(.97)}
        .recent-card .app-tile-icon{width:46px;height:46px;font-size:1.5rem;border-radius:12px}
        .recent-name{font-size:.72rem;font-weight:700;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .recent-time{font-size:.58rem;color:var(--text-3);font-family:'JetBrains Mono',monospace}
        .apps-empty{color:var(--text-2);font-size:.86rem;padding:40px 16px;text-align:center}
        .apps-empty b{display:block;font-size:1.6rem;margin-bottom:8px}

        @media(min-width:600px){
            #apps-scroll{padding:18px 20px 32px}
            .apps-top{padding:14px 20px 12px}
            .hero{padding:18px 22px}
            .hero-title{font-size:1.15rem}
        }

        /* ── PANEL SECTIONS (cards) ── */
        .panel-sec{margin:12px 16px 0;padding:16px 18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
        .panel-sec:last-child{margin-bottom:12px}
        .panel-sec h3{font-size:.7rem;font-weight:800;color:var(--text-3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
        .panel-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;font-size:.84rem;color:var(--text-2);border-bottom:1px dashed var(--border)}
        .panel-row:last-of-type{border-bottom:none}
        .panel-badge{font-size:.72rem;background:var(--surface-2);border:1px solid var(--border-hi);border-radius:999px;padding:3px 10px;color:var(--text);font-family:'JetBrains Mono',monospace;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .panel-btn{width:100%;padding:11px 14px;margin-top:8px;border-radius:var(--radius-sm);border:1px solid var(--border-hi);background:var(--surface-2);color:var(--text);font:inherit;font-size:.84rem;font-weight:700;cursor:pointer;text-align:left;transition:background .15s,border-color .15s;display:block}
        .panel-btn:hover{background:var(--surface-3);border-color:var(--accent-line)}
        .panel-btn.accent{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
        .panel-btn.danger{color:var(--c-danger);border-color:rgba(255,84,112,.3)}

        /* ── DATA TABLE ── */
        .table-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface)}
        .data-table{width:100%;border-collapse:collapse;font-size:.76rem;min-width:480px}
        .data-table th{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text-3);font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;background:var(--surface-2);position:sticky;top:0}
        .data-table td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--text-2)}
        .data-table tr:last-child td{border-bottom:none}
        .data-table td.nowrap{white-space:nowrap}
        .data-table td.ellipsis{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .data-table tr:hover td{background:rgba(255,255,255,.025)}

        /* ── ADMIN USERS ── */
        .users-list{display:flex;flex-direction:column;gap:6px}
        .user-row{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:.82rem;flex-wrap:wrap}
        .u-email{font-weight:700;flex:1;min-width:120px}
        .u-role{font-size:.64rem;font-weight:700;background:var(--surface-3);padding:3px 9px;border-radius:999px;color:var(--text-2)}
        .u-role.admin{background:var(--accent-soft);color:var(--accent)}
        .u-meta{width:100%;font-size:.65rem;color:var(--text-3);margin-top:2px}
        .u-actions{display:flex;gap:4px}
        .u-actions button{padding:5px 10px;border-radius:999px;border:1px solid var(--border-hi);background:var(--surface-3);color:var(--text-2);font:inherit;font-size:.7rem;font-weight:700;cursor:pointer;transition:background .15s}
        .u-actions button:hover{background:var(--surface-2);color:var(--text)}

        /* ── LOGS FILTERS ── */
        .logs-filters{display:flex;gap:8px;padding:0 16px 12px;flex-shrink:0;flex-wrap:wrap}
        .logs-filters select{padding:9px 12px;background:var(--surface-2);border:1px solid var(--border-hi);border-radius:var(--radius-sm);color:var(--text);font:inherit;font-size:.82rem;outline:none;flex:1;min-width:120px}
        .logs-info{padding:6px 16px;font-size:.68rem;color:var(--text-3)}

        /* ── LEADERBOARD ── */
        .board-list{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
        .board-item{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;transition:border-color .15s}
        .board-item:hover{border-color:var(--border-hi)}
        .board-item.self{border-color:var(--accent-line);background:linear-gradient(135deg,var(--accent-soft),var(--surface-2))}
        .board-head{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;transition:background .15s}
        .board-pos{width:34px;height:34px;border-radius:12px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.84rem;flex-shrink:0;font-family:'JetBrains Mono',monospace}
        .board-pos.top1{background:var(--c-finish);color:#0b0d14}
        .board-pos.top2{background:#c8ccd8;color:#0b0d14}
        .board-pos.top3{background:#d08a4a;color:#0b0d14}
        .board-info{flex:1;min-width:0}
        .board-name{font-size:.88rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .board-meta{font-size:.66rem;color:var(--text-3);margin-top:2px}
        .board-time{font-size:1rem;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;flex-shrink:0;text-align:right}
        .board-time small{font-size:.6rem;font-weight:400;color:var(--text-2)}
        .board-expand{display:none;padding:0 14px 12px;border-top:1px solid var(--border)}
        .board-expand.open{display:block}
        .board-app-row{display:flex;justify-content:space-between;padding:7px 0;font-size:.78rem;color:var(--text-2);border-bottom:1px dashed var(--border)}
        .board-app-row:last-child{border-bottom:none}
        .role-tag{font-size:.55rem;background:var(--accent-soft);color:var(--accent);padding:1px 7px;border-radius:999px;vertical-align:middle;margin-left:6px;font-weight:800}
        .empty-state{padding:48px 20px;text-align:center;color:var(--text-2);font-size:.86rem}
        .empty-ico{font-size:2.2rem;margin-bottom:10px}

        /* ── STAT CARDS ── */
        .stat-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;padding:14px 16px}
        .stat-card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 12px;text-align:center}
        .stat-card-val{font-size:1.35rem;font-weight:800;letter-spacing:-.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
        .stat-card-lbl{font-size:.66rem;color:var(--text-3);margin-top:4px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}

        /* ── SETTINGS SUB-TABS (segmented) ── */
        .sett-tabs{display:flex;gap:6px;padding:12px 16px 4px;flex-shrink:0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
        .sett-tabs::-webkit-scrollbar{display:none}
        .sett-tab{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;font-size:.78rem;font-weight:700;color:var(--text-2);cursor:pointer;border:1px solid var(--border);background:var(--surface-2);border-radius:999px;white-space:nowrap;transition:all .15s;font-family:inherit}
        .sett-tab svg{width:15px;height:15px;stroke:currentColor;flex-shrink:0}
        .sett-tab:hover{color:var(--text);border-color:var(--accent-line)}
        .sett-tab.active{color:#0b0d14;background:var(--grad);border-color:transparent;box-shadow:0 6px 16px rgba(109,141,255,.25)}
        .sett-tab.active svg{stroke:#0b0d14}

        /* ── CACHE EDITOR ── */
        .cache-list{display:flex;flex-direction:column;gap:4px;padding:12px 16px}
        .cache-item{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:.78rem;cursor:pointer;transition:background .15s,border-color .15s}
        .cache-item:hover{background:var(--surface-3);border-color:var(--border-hi)}
        .cache-key{flex:1;font-weight:600;font-family:'JetBrains Mono',monospace;font-size:.72rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .cache-size{font-size:.62rem;color:var(--text-3);font-family:'JetBrains Mono',monospace;flex-shrink:0}
        .cache-edit{display:flex;flex-direction:column;gap:8px;padding:12px 16px}
        .cache-edit-ta{width:100%;min-height:200px;background:var(--surface-2);border:1px solid var(--border-hi);border-radius:var(--radius-sm);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.72rem;line-height:1.5;padding:10px;resize:vertical;outline:none}
        .cache-edit-ta:focus{border-color:var(--accent)}
        .cache-actions{display:flex;gap:8px;flex-wrap:wrap}
        .cache-btn{padding:9px 16px;border-radius:999px;border:1px solid var(--border-hi);background:var(--surface-2);color:var(--text);font:inherit;font-size:.78rem;font-weight:700;cursor:pointer;transition:all .15s}
        .cache-btn:hover{background:var(--surface-3);border-color:var(--accent-line)}
        .cache-btn.pr{background:var(--grad);border-color:transparent;color:#0b0d14}
        .cache-btn.dn{color:var(--c-danger);border-color:rgba(255,84,112,.3)}

        /* ── DATA BROWSER ── */
        .data-sheets{display:flex;flex-direction:column;gap:4px;padding:12px 16px}
        .data-sheet-group{margin-bottom:12px}
        .data-sheet-group-title{font-size:.64rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-3);padding:0 2px 8px;font-weight:800}
        .data-sheet-item{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-size:.84rem;transition:all .15s;margin-bottom:6px}
        .data-sheet-item:hover{background:var(--surface-3);border-color:var(--accent-line)}
        .data-sheet-item .ico{flex-shrink:0}
        .data-sheet-name{flex:1;font-weight:700}
        .data-sheet-arrow{color:var(--text-3);flex-shrink:0}
        .data-back{display:flex;align-items:center;gap:6px;padding:12px 16px;font-size:.84rem;font-weight:700;color:var(--accent);cursor:pointer;border-bottom:1px solid var(--border)}
        .data-back:hover{background:rgba(255,255,255,.03)}
        .data-toolbar{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;flex-shrink:0}
        .data-toolbar .cache-btn{padding:6px 12px;font-size:.72rem}
        .data-cell-edit{background:var(--surface-2);border:1px solid var(--accent);border-radius:4px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.72rem;padding:4px 6px;width:100%;min-width:60px;outline:none}

        /* ── DEV GUIDE ── */
        .devguide{padding:16px;font-size:.8rem;line-height:1.7;color:var(--text-2)}
        .devguide pre{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;overflow-x:auto;margin:8px 0;font-family:'JetBrains Mono',monospace;font-size:.68rem;line-height:1.5;color:var(--text);white-space:pre-wrap;word-break:break-word}
        .devguide h4{color:var(--text);font-size:.9rem;margin:16px 0 6px;font-weight:800}
        .devguide code{background:var(--surface-2);padding:1px 6px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:.72rem}
        .copy-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;background:var(--grad);color:#0b0d14;border:none;font:inherit;font-size:.78rem;font-weight:800;cursor:pointer;transition:filter .15s;margin:8px 0}
        .copy-btn:hover{filter:brightness(1.06)}

        /* ── IMMERSIVE CONTAINER ── */
        #immersive-container{display:none;position:fixed;inset:0;z-index:9999;background:var(--bg)}
        #app-iframe{width:100%;height:100%;border:none;display:block}
        #btn-float-back{position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;width:44px;height:44px;border-radius:14px;background:rgba(19,22,34,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);color:var(--text);font-size:1.3rem;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10000;transition:background .2s,transform .1s;box-shadow:0 6px 16px rgba(0,0,0,.45)}
        #btn-float-back:hover{background:rgba(35,40,57,.85)}
        #btn-float-back:active{transform:scale(.92)}

        /* ── TOAST ── */
        #toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(6px);background:var(--surface-3);border:1px solid var(--border-hi);color:var(--text);padding:10px 18px;border-radius:999px;font-size:.82rem;font-weight:600;z-index:10001;pointer-events:none;transition:opacity .25s,transform .25s;opacity:0;white-space:nowrap;max-width:92vw;text-align:center;box-shadow:var(--shadow);backdrop-filter:blur(10px);overflow:hidden;text-overflow:ellipsis}
        #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
        #toast.ok{background:rgba(34,211,166,.14);border-color:rgba(34,211,166,.4);color:var(--c-work)}
        #toast.err{background:rgba(255,84,112,.14);border-color:rgba(255,84,112,.4);color:var(--c-danger)}
        @media(min-width:768px){#toast{bottom:28px}}

        /* ── LOADER ── */
        #loader{position:fixed;inset:0;background:rgba(11,13,20,.78);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:20000;flex-direction:column;gap:12px}
        #loader.show{display:flex}
        .loader-spin{width:38px;height:38px;border:3px solid var(--border-hi);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}

        ::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border-hi);border-radius:3px}
    </style>
</head>

<!-- ═══ IMMERSIVE CONTAINER ═══ -->
<div id="immersive-container">
    <button id="btn-float-back" title="Закрыть приложение">←</button>
    <iframe id="app-iframe" sandbox="allow-scripts allow-same-origin allow-modals allow-downloads" allowfullscreen></iframe>
</div>

<div id="toast"></div>
<div id="loader"><div class="loader-spin"></div></div>

<script>
'use strict';

/* ══════════════════════════════════════════════════════════════════
 * CONSTANTS
 * ═════════════════════════════════════════════════════════════════ */
const LS_CFG  = 'mcg_config';
const LS_USER = 'mcg_user';
const LS_PID  = 'kuapp_pid';   // персональный ID игрока (P-XXXXXX), выдаётся сервером при первом входе
const LS_LAUNCHES = 'mcg_launches';

/* ── DB Schema (sys_ prefix) ── */
const DB_SYSTEM_SCHEMA = {
    sys_Users:  { headers: ['ID','Email','Password','Role','TotalXP','CreatedAt','Status','Name'] },
    sys_Logs:   { headers: ['Timestamp','Email','AppID','EventType','Details'] },
    sys_Scores: { headers: ['Timestamp','Email','AppID','RawScore','XP'] }
};

/* ══════════════════════════════════════════════════════════════════
 * STATE
 * ═════════════════════════════════════════════════════════════════ */
const HARDCODED_GAS_URL = 'https://script.google.com/macros/s/AKfycbz1UKFwY4nUUQkVVSgupHY6SREofWFy2qDhlEhpP7dUaUIKmjdO-k7GqPKw0QHC0aj1yg/exec';
let cfg = { gasUrl: HARDCODED_GAS_URL };
let currentUser    = null;
let appsData       = null;
let searchQuery    = '';
let currentSession = { appId: null, startTime: null };
let swRegistration = null;
let activeTab      = 'apps';
let _dbSheetCache  = null;   // Set<string>
let _dbSheetMeta   = null;   // Map<title, sheetId>
let _adminUsers    = [];
let _logsRawRows   = [];
let _settTab       = 'general';
let _dataViewSheet = null;   // currently viewed sheet name
let _dataRows      = [];
let _dataHeaders   = [];
let _cacheEditKey  = null;
let _statsAggRows  = [];     // строки вкладки «Статистика» (для фильтра по индексу)
let _dataSheetList = [];     // имена листов вкладки «Справочники» (для onclick по индексу)
let _cacheKeys     = [];     // ключи localStorage вкладки «Кэш» (для onclick по индексу)

/* ══════════════════════════════════════════════════════════════════
 * UTILS
 * ═════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
/** Экранирует текст для HTML, включая кавычки — безопасно и в атрибутах. */
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, ch => ESC_MAP[ch]); }
function fmt(n) { return (n || 0).toLocaleString('ru-RU'); }

function toast(msg, type = '') {
    const el = $('toast');
    el.textContent = msg;
    el.className = 'show' + (type ? ' ' + type : '');
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.className = ''; }, 3000);
}

function showLoader(on) { $('loader').classList.toggle('show', !!on); }

function formatTs(ts) {
    try { return new Date(ts).toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }); }
    catch { return ts || ''; }
}

function formatDuration(sec) {
    sec = Math.round(sec);
    if (sec < 60) return sec + ' сек';
    const m = Math.floor(sec / 60);
    if (m < 60) return m + ' мин ' + (sec % 60 ? (sec % 60) + ' сек' : '');
    const h = Math.floor(m / 60);
    return h + ' ч ' + (m % 60 ? (m % 60) + ' мин' : '');
}

function formatRelative(ts) {
    if (!ts) return '';
    const diff = Date.now() - ts;
    const sec = Math.floor(diff / 1000);
    if (sec < 60) return 'только что';
    const min = Math.floor(sec / 60);
    if (min < 60) return min + ' мин. назад';
    const hr = Math.floor(min / 60);
    if (hr < 24) return hr + ' ч. назад';
    const days = Math.floor(hr / 24);
    if (days === 1) return 'вчера';
    return days + ' дн. назад';
}

function getLastLaunch(appId) {
    try { return JSON.parse(localStorage.getItem(LS_LAUNCHES) || '{}')[appId] || null; } catch { return null; }
}
function setLastLaunch(appId) {
    try { const d = JSON.parse(localStorage.getItem(LS_LAUNCHES) || '{}'); d[appId] = Date.now(); localStorage.setItem(LS_LAUNCHES, JSON.stringify(d)); } catch {}
}

/* ══════════════════════════════════════════════════════════════════
 * CONFIG / STORAGE
 * ═════════════════════════════════════════════════════════════════ */
function loadCfg()  { try { const s = localStorage.getItem(LS_CFG);  if (s) cfg = JSON.parse(s); } catch {} cfg.gasUrl = HARDCODED_GAS_URL; }
function saveCfg()  { localStorage.setItem(LS_CFG, JSON.stringify(cfg)); }
function loadUser() { try { const s = localStorage.getItem(LS_USER); if (s) currentUser = JSON.parse(s); } catch {} }
function saveUser() { if (currentUser) localStorage.setItem(LS_USER, JSON.stringify(currentUser)); else localStorage.removeItem(LS_USER); }

/* ══════════════════════════════════════════════════════════════════
 * VIEW SWITCHING
 * ═════════════════════════════════════════════════════════════════ */
function showView(name) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    const el = $('v-' + name);
    if (el) el.classList.add('active');
}

/* ══════════════════════════════════════════════════════════════════
 * GAS PROXY — все обращения к БД идут через Google Apps Script
 * ═════════════════════════════════════════════════════════════════ */
async function gasCall(action, params = {}) {
    if (!cfg.gasUrl) throw new Error('GAS URL не настроен');
    const body = { action, params };
    if (currentUser?.token) body.token = currentUser.token;   // токен сессии (см. gas/Code.gs → AUTH)
    const r = await fetch(cfg.gasUrl, {
        method: 'POST',
        body: JSON.stringify(body)
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    if (!d.ok) {
        if (d.code === 'AUTH_EXPIRED' && currentUser) onSessionExpired();
        throw new Error(d.error || 'Ошибка GAS');
    }
    return d.data;
}

/** Сервер отверг токен — сбрасываем локальную сессию. */
function onSessionExpired() {
    currentUser = null;
    saveUser();
    updateUserUI();
    toast('Сессия истекла — войдите снова', 'err');
}

async function apiRead(range)          { return gasCall('read', { range }); }
async function apiAppend(range, values) { return gasCall('append', { range, values }); }
async function apiUpdate(range, values) { return gasCall('update', { range, values }); }
async function apiBatchValues(data)     { return gasCall('batchValues', { data }); }

/* ══════════════════════════════════════════════════════════════════
 * SHEET NAME VALIDATION & DB CACHE
 * ═════════════════════════════════════════════════════════════════ */
function validateSheetName(name) {
    if (!/^[a-zA-Z0-9_]+$/.test(name)) {
        throw new Error('Недопустимое имя таблицы: ' + name + '. Разрешены только буквы, цифры и _');
    }
}
function isSysSheet(name) { return /^sys_/i.test(String(name || '')); }
/** Проверка диапазона для PlatformAPI.db: системные листы приложениям недоступны. */
function validateSheetRange(range) {
    const sheetName = String(range || '').split('!')[0];
    validateSheetName(sheetName);
    if (isSysSheet(sheetName)) throw new Error('Системные таблицы (sys_*) недоступны приложениям');
}
async function refreshDbCache() {
    const result = await gasCall('meta');
    const sheets = result.sheets || [];
    _dbSheetCache = new Set(sheets.map(s => s.title));
    _dbSheetMeta = new Map(sheets.map(s => [s.title, s.sheetId]));
    return _dbSheetCache;
}

/* ══════════════════════════════════════════════════════════════════
 * DB INITIALIZATION — ensureTables
 * ═════════════════════════════════════════════════════════════════ */
async function dbEnsureTables(tablesConfig) {
    for (const t of tablesConfig) validateSheetName(t.name);
    if (!_dbSheetCache) await refreshDbCache();
    const missing = tablesConfig.filter(t => !_dbSheetCache.has(t.name));
    if (!missing.length) return;
    await gasCall('addSheets', { titles: missing.map(t => t.name) });
    for (const t of missing) {
        try { await apiAppend(`${t.name}!A1`, [t.headers]); } catch {}
        _dbSheetCache.add(t.name);
    }
    await refreshDbCache();
}

async function dbInitAllSheets() {
    const systemTables = Object.entries(DB_SYSTEM_SCHEMA).map(([name, desc]) => ({
        name, headers: desc.headers
    }));
    await dbEnsureTables(systemTables);
}

/* ══════════════════════════════════════════════════════════════════
 * USER AUTH — вход по коду доступа (gas/Code.gs → AUTH)
 * Коды лежат в Script Properties: ADMIN_CODE (админ), PLAYER_CODE (игроки).
 * Сервер возвращает { login, playerId, name, role, total_xp, token };
 * персональный ID хранится в localStorage и присылается при следующих входах.
 * ═════════════════════════════════════════════════════════════════ */
function getStoredPlayerId() { try { return localStorage.getItem(LS_PID) || ''; } catch { return ''; } }
function storePlayerId(id)   { try { if (id) localStorage.setItem(LS_PID, id); } catch {} }
async function loginByCode(code, name) {
    const user = await gasCall('loginCode', { code, name, playerId: getStoredPlayerId() });
    storePlayerId(user.playerId);
    return user;
}

/** Подтянуть актуальные роль/XP по токену; просроченный токен сбросит сессию. */
async function refreshProfile() {
    if (!currentUser?.token) return;
    try {
        const me = await gasCall('me');
        if (currentUser) { Object.assign(currentUser, me); saveUser(); updateUserUI(); }
    } catch {}
}

/* ══════════════════════════════════════════════════════════════════
 * GUEST SCORE & IP HELPERS
 * ═════════════════════════════════════════════════════════════════ */
let _guestIdentityCache = null;
async function getGuestIdentity() {
    if (currentUser) return currentUser.login;
    if (_guestIdentityCache) return _guestIdentityCache;

    try {
        const res = await fetch('https://ipapi.co/json/', { signal: AbortSignal.timeout(3500) });
        if (res.ok) {
            const d = await res.json();
            if (d.ip) {
                const loc = [d.city, d.country_name].filter(Boolean).join(', ');
                _guestIdentityCache = `Гость (${d.ip}${loc ? ' · ' + loc : ''})`;
                return _guestIdentityCache;
            }
        }
    } catch {}

    try {
        const res = await fetch('https://api.ipify.org?format=json', { signal: AbortSignal.timeout(3000) });
        if (res.ok) {
            const d = await res.json();
            if (d.ip) {
                _guestIdentityCache = `Гость (${d.ip})`;
                return _guestIdentityCache;
            }
        }
    } catch {}

    _guestIdentityCache = 'Гость';
    return _guestIdentityCache;
}

function getGuestScores() {
    try { return JSON.parse(localStorage.getItem('mcg_guest_scores') || '{}'); } catch { return {}; }
}
function saveGuestScore(appId, rawScore, xpEarned) {
    try {
        const d = getGuestScores();
        const prev = d[appId] || { score: 0, xp: 0 };
        if (rawScore > prev.score) {
            d[appId] = { score: rawScore, xp: (prev.xp || 0) + (xpEarned || 0), ts: Date.now() };
        } else {
            d[appId].xp = (prev.xp || 0) + (xpEarned || 0);
        }
        localStorage.setItem('mcg_guest_scores', JSON.stringify(d));
    } catch {}
}
function getGuestTotalXP() {
    const d = getGuestScores();
    return Object.values(d).reduce((s, x) => s + (x.xp || 0), 0);
}

/* ══════════════════════════════════════════════════════════════════
 * PLATFORM API (accessible from iframes via window.parent.PlatformAPI)
 * ═════════════════════════════════════════════════════════════════ */
window.PlatformAPI = {
    user: {
        getProfile: () => currentUser
            ? { login: currentUser.login, playerId: currentUser.playerId, name: currentUser.name || '', role: currentUser.role, total_xp: currentUser.total_xp, isGuest: false }
            : { login: 'Гость', playerId: '', name: '', role: 'guest', total_xp: getGuestTotalXP(), isGuest: true },
        isAdmin: () => (currentUser?.role || '').toLowerCase() === 'admin',
        isGuest: () => !currentUser,
        getRole: () => (currentUser ? (currentUser.role || 'player') : 'guest').toLowerCase(),
        getToken: () => currentUser?.token || null      // для сетевых комнат (kunet.js)
    },
    db: {
        read: async (range) => { validateSheetRange(range); return apiRead(range); },
        append: async (range, values) => { validateSheetRange(range); return apiAppend(range, values); },
        update: async (range, values) => { validateSheetRange(range); return apiUpdate(range, values); },
        batchValues: async (data) => {
            if (Array.isArray(data)) data.forEach(d => { if (d.range) validateSheetRange(d.range); });
            return apiBatchValues(data);
        },
        ensureTables: async (tablesConfig) => {
            (tablesConfig || []).forEach(t => { if (isSysSheet(t.name)) throw new Error('Системные таблицы (sys_*) недоступны приложениям'); });
            showLoader(true);
            try { await dbEnsureTables(tablesConfig); toast('✓ Таблицы готовы', 'ok'); }
            catch (e) { toast('Ошибка БД: ' + e.message, 'err'); throw e; }
            finally { showLoader(false); }
        },
        getGasUrl: () => cfg.gasUrl
    },
    gameplay: {
        submitScore: async (appId, rawScore, xpEarned) => {
            if (!currentUser) {
                saveGuestScore(appId, rawScore, xpEarned);
                const guestUser = await getGuestIdentity();
                apiAppend('sys_Logs!A:E', [[new Date().toISOString(), guestUser, appId, 'guest_score', `Score: ${rawScore}, XP: ${xpEarned}`]]).catch(() => {});
                toast(`🎮 Результат: ${rawScore}! Войдите в аккаунт, чтобы сохранять баллы в общий рейтинг.`, 'ok');
                return;
            }
            // Сервер сам пишет sys_Scores и прибавляет XP строке пользователя (по логину из токена)
            try {
                const res = await gasCall('addXP', { appId, rawScore, xp: xpEarned });
                if (currentUser) { currentUser.total_xp = res.total_xp; saveUser(); updateUserUI(); }
                toast(`🏆 Очки сохранены: ${rawScore} (+${xpEarned} XP)`, 'ok');
            } catch (e) {
                toast('Не удалось сохранить очки: ' + e.message, 'err');
            }
        }
    },
    system: {
        logSession: async (appId, durationSec) => {
            const u = await getGuestIdentity();
            try { await apiAppend('sys_Logs!A:E', [[new Date().toISOString(), u, appId, 'session', String(durationSec)]]); } catch {}
        },
        log: async (appId, eventType, details) => {
            const u = await getGuestIdentity();
            try { await apiAppend('sys_Logs!A:E', [[new Date().toISOString(), u, appId, eventType, String(details || '')]]); } catch {}
        }
    },
    ui: {
        showToast:  (msg, type) => toast(msg, type),
        showLoader: (on)        => showLoader(on),
        openSettings: ()        => switchTab('settings'),
        openLogin: ()           => { $('btn-float-back').click(); showView('login'); }
    }
};

/* ══════════════════════════════════════════════════════════════════
 * TAB NAVIGATION
 * ═════════════════════════════════════════════════════════════════ */
function switchTab(tabName) {
    if (!currentUser && ['board', 'data', 'settings'].includes(tabName)) {
        tabName = 'apps';
    }
    activeTab = tabName;
    document.querySelectorAll('.side-item, .bnav-item').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tabName);
    });
    document.querySelectorAll('.tab-panel').forEach(p => {
        p.classList.toggle('active', p.id === 'tab-' + tabName);
    });
    const titles = { apps: 'Приложения', stats: 'Статистика', board: 'Рейтинг', data: 'Справочники', settings: 'Настройки' };
    $('content-title').textContent = titles[tabName] || '';
    if (tabName === 'stats') renderStatsTab();
    else if (tabName === 'board') renderBoardTab();
    else if (tabName === 'data') renderDataTab();
    else if (tabName === 'settings') renderSettingsTab();
}

/* ══════════════════════════════════════════════════════════════════
 * APP LAUNCH / SESSION TRACKING
 * ═════════════════════════════════════════════════════════════════ */
function launchApp(file, appId) {
    currentSession = { appId, startTime: Date.now() };
    setLastLaunch(appId);
    $('app-iframe').src = (file.startsWith('http://') || file.startsWith('https://')) ? file : `./apps/${file}`;
    $('immersive-container').style.display = 'block';
}

$('btn-float-back').addEventListener('click', () => {
    if (currentSession.appId && currentSession.startTime) {
        const durationSec = Math.round((Date.now() - currentSession.startTime) / 1000);
        if (durationSec > 5) {
            window.PlatformAPI.system.logSession(currentSession.appId, durationSec);
        }
    }
    currentSession = { appId: null, startTime: null };
    $('immersive-container').style.display = 'none';
    $('app-iframe').src = 'about:blank';
    if (activeTab === 'apps') renderAppsGrid();
});

/* ══════════════════════════════════════════════════════════════════
 * APPS GRID
 * ═════════════════════════════════════════════════════════════════ */
const BUILTIN_APPS = [
    { id: 'gas_webapp', name: 'GAS WebApp', icon: '🌐', desc: 'Google Apps Script Веб-Приложение.', file: 'https://script.google.com/macros/s/AKfycbz1UKFwY4nUUQkVVSgupHY6SREofWFy2qDhlEhpP7dUaUIKmjdO-k7GqPKw0QHC0aj1yg/exec' },
    { id: 'trainer',    name: 'Тренер',      icon: '🏋️', desc: 'Таймер тренировки McGill Big 3.',       file: 'trainer.html' },
    { id: 'dictionary', name: 'Словарь',     icon: '📖', desc: 'Изучай слова на разных языках.',         file: 'dictionary.html' }
];

async function fetchAndRenderApps() {
    let categories = [{ id: 'apps', label: '⭐ Приложения', games: BUILTIN_APPS }];
    try {
        const res = await fetch('./apps/index.json');
        if (res.ok) {
            const data = await res.json();
            if (data.categories) {
                const extraCats = data.categories
                    .map(cat => ({ ...cat, games: (cat.games || []).filter(g =>
                        !['wordlearning','dictionary','trainer'].includes(g.id) &&
                        !['WordLearning.html','dictionary.html','trainer.html'].includes(g.file))
                    }))
                    .filter(cat => (cat.games || []).length > 0);
                categories = [...categories, ...extraCats];
            }
        }
    } catch {}
    appsData = categories;
    renderChips();
    renderAppsGrid();
}

/* Игры с режимом «по сети» (kunet.js) — помечаются бейджем на плитке */
const ONLINE_GAMES = new Set(['tictac', 'reversi', 'wallrush', 'billiard']);
let activeCat = 'all';

function initials(name) {
    const s = String(name || '').trim();
    if (!s) return 'Г';
    const parts = s.split(/[\s_\-·]+/).filter(Boolean);
    const ini = ((parts[0]?.[0] || '') + (parts[1]?.[0] || '')).toUpperCase();
    return ini || s[0].toUpperCase();
}

/* Чипы категорий над сеткой приложений */
function renderChips() {
    const el = $('apps-chips');
    if (!el) return;
    const cats = [{ id: 'all', label: 'Все' }, ...(appsData || []).map(c => ({ id: c.id, label: String(c.label || '').replace(/^[^\p{L}\p{N}]+/u, '').trim() || c.id }))];
    if (!cats.some(c => c.id === activeCat)) activeCat = 'all';
    el.innerHTML = cats.map(c => `<button class="chip${activeCat === c.id ? ' active' : ''}" data-cat="${esc(c.id)}">${esc(c.label)}</button>`).join('');
    el.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
        activeCat = b.dataset.cat;
        renderChips();
        renderAppsGrid();
    }));
}

function tileHtml(g) {
    const appId = g.id || g.file;
    const ll = getLastLaunch(appId);
    const meta = [];
    if (ONLINE_GAMES.has(appId)) meta.push('<span class="badge net">● по сети</span>');
    if (ll) meta.push(`<span class="badge time">${esc(formatRelative(ll))}</span>`);
    return `<div class="app-tile" data-file="${esc(g.file)}" data-id="${esc(appId)}" role="button" tabindex="0">
        <div class="app-tile-icon">${g.icon || '🎮'}</div>
        <div class="app-tile-body">
            <div class="app-tile-name">${esc(g.name)}</div>
            <div class="app-tile-desc">${esc(g.desc || '')}</div>
            ${meta.length ? `<div class="app-tile-meta">${meta.join('')}</div>` : ''}
        </div>
        <div class="app-tile-arrow"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
    </div>`;
}

function heroHtml() {
    if (!currentUser) {
        return `<div class="hero">
            <div class="avatar guest">Г</div>
            <div class="hero-body">
                <div class="hero-title">Привет, Гость!</div>
                <div class="hero-sub">Играйте без входа. Код игрока откроет игры по сети и общий рейтинг.</div>
            </div>
            <button class="hero-cta" onclick="showView('login')">Войти</button>
        </div>`;
    }
    const name = currentUser.name || currentUser.playerId || currentUser.login;
    const badges = [`<span class="badge xp">⭐ ${fmt(currentUser.total_xp || 0)} XP</span>`];
    if (currentUser.role === 'admin') badges.unshift('<span class="badge admin">🔑 администратор</span>');
    if (currentUser.playerId) badges.push(`<span class="badge">ID ${esc(currentUser.playerId)}</span>`);
    return `<div class="hero">
        <div class="avatar">${esc(initials(name))}</div>
        <div class="hero-body">
            <div class="hero-title">Привет, ${esc(name)}!</div>
            <div class="hero-sub">Игры с бейджем «по сети» можно играть с друзьями онлайн.</div>
            <div class="hero-badges">${badges.join('')}</div>
        </div>
    </div>`;
}

function renderAppsGrid() {
    const el = $('apps-scroll');
    const q  = searchQuery.toLowerCase().trim();
    const showAll = !q && activeCat === 'all';
    let html = '';

    if (showAll) html += heroHtml();

    if (showAll) {
        const all = [];
        (appsData || []).forEach(cat => (cat.games || []).forEach(g => all.push(g)));
        const recent = all
            .filter(g => { const t = getLastLaunch(g.id || g.file); return t && Date.now() - t < 30 * 86400 * 1000; })
            .sort((a, b) => (getLastLaunch(b.id || b.file) || 0) - (getLastLaunch(a.id || a.file) || 0))
            .slice(0, 8);
        if (recent.length) {
            html += `<div class="app-category"><div class="app-cat-label">🔥 Недавно сыгранные</div><div class="recent-row">` +
                recent.map(g => {
                    const id = g.id || g.file;
                    return `<div class="recent-card" data-file="${esc(g.file)}" data-id="${esc(id)}" role="button" tabindex="0">
                        <div class="app-tile-icon">${g.icon || '🎮'}</div>
                        <div class="recent-name">${esc(g.name)}</div>
                        <div class="recent-time">${esc(formatRelative(getLastLaunch(id)))}</div>
                    </div>`;
                }).join('') + '</div></div>';
        }
    }

    (appsData || []).forEach(cat => {
        if (!q && activeCat !== 'all' && cat.id !== activeCat) return;
        const apps = q
            ? (cat.games || []).filter(g => g.name.toLowerCase().includes(q) || (g.desc || '').toLowerCase().includes(q))
            : (cat.games || []);
        if (!apps.length) return;
        html += `<div class="app-category"><div class="app-cat-label">${cat.label}<span class="app-cat-count">${apps.length}</span></div><div class="apps-grid">${apps.map(tileHtml).join('')}</div></div>`;
    });

    if (!html) html = `<div class="apps-empty"><b>🔍</b>Ничего не найдено по запросу «${esc(searchQuery.trim())}»</div>`;
    el.innerHTML = html;

    el.querySelectorAll('.app-tile, .recent-card').forEach(tile => {
        const open = () => launchApp(tile.dataset.file, tile.dataset.id || tile.dataset.file);
        tile.addEventListener('click', open);
        tile.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
    });
}

const searchInp = $('apps-search');
const clearBtn = $('apps-search-clear');
if (searchInp) {
    searchInp.addEventListener('input', e => {
        searchQuery = e.target.value;
        if (clearBtn) clearBtn.style.display = searchQuery ? 'flex' : 'none';
        renderAppsGrid();
    });
}
if (clearBtn) {
    clearBtn.addEventListener('click', () => {
        searchQuery = '';
        if (searchInp) searchInp.value = '';
        clearBtn.style.display = 'none';
        renderAppsGrid();
    });
}

/* ══════════════════════════════════════════════════════════════════
 * STATS TAB — Session statistics
 * ═════════════════════════════════════════════════════════════════ */
async function renderStatsTab() {
    const c = $('stats-content');
    c.innerHTML = '<div class="empty-state"><div class="loader-spin" style="margin:0 auto"></div></div>';
    try {
        const res = await apiRead('sys_Logs!A2:E5000');
        const allRows = (res.values || []).filter(r => r[0] && r[3] === 'session');

        if (!allRows.length) {
            c.innerHTML = '<div class="empty-state"><div class="empty-ico">📊</div>Нет данных о сессиях</div>';
            return;
        }

        // Summary cards
        const totalSessions = allRows.length;
        const totalSec = allRows.reduce((s, r) => s + (parseInt(r[4]) || 0), 0);
        const uniqueUsers = new Set(allRows.map(r => r[1])).size;
        const uniqueApps = new Set(allRows.map(r => r[2])).size;

        // Per-user per-app aggregation
        const agg = {};
        allRows.forEach(r => {
            const user = r[1] || '?', app = r[2] || '?', sec = parseInt(r[4]) || 0, ts = r[0];
            const key = user + '|' + app;
            if (!agg[key]) agg[key] = { user, app, count: 0, totalSec: 0, lastTs: '' };
            agg[key].count++;
            agg[key].totalSec += sec;
            if (ts > agg[key].lastTs) agg[key].lastTs = ts;
        });

        const rows = Object.values(agg).sort((a, b) => b.totalSec - a.totalSec);
        _statsAggRows = rows;   // строки таблицы адресуются индексом (data-i), а не значениями

        // Filters
        const appIds = [...new Set(allRows.map(r => r[2]).filter(Boolean))];
        const users  = [...new Set(allRows.map(r => r[1]).filter(Boolean))];

        let html = `
        <div class="stat-cards">
            <div class="stat-card"><div class="stat-card-val">${totalSessions}</div><div class="stat-card-lbl">Сессий</div></div>
            <div class="stat-card"><div class="stat-card-val">${formatDuration(totalSec)}</div><div class="stat-card-lbl">Общее время</div></div>
            <div class="stat-card"><div class="stat-card-val">${uniqueUsers}</div><div class="stat-card-lbl">Пользователей</div></div>
            <div class="stat-card"><div class="stat-card-val">${uniqueApps}</div><div class="stat-card-lbl">Приложений</div></div>
        </div>
        <div class="logs-filters">
            <select id="stats-f-app" onchange="filterStatsTable()"><option value="">Все приложения</option>${appIds.map(id => `<option value="${esc(id)}">${esc(id)}</option>`).join('')}</select>
            <select id="stats-f-user" onchange="filterStatsTable()"><option value="">Все пользователи</option>${users.map(u => `<option value="${esc(u)}">${esc(u)}</option>`).join('')}</select>
        </div>
        <div style="flex:1;overflow:auto;padding:0 16px 16px"><div class="table-scroll">
        <table class="data-table" id="stats-table">
            <tr><th>Пользователь</th><th>Приложение</th><th>Сессий</th><th>Общее время</th><th>Последний запуск</th></tr>`;
        rows.forEach((r, i) => {
            html += `<tr data-i="${i}">
                <td>${esc(r.user)}</td>
                <td>${esc(r.app)}</td>
                <td>${r.count}</td>
                <td class="nowrap">${formatDuration(r.totalSec)}</td>
                <td class="nowrap">${formatTs(r.lastTs)}</td>
            </tr>`;
        });
        html += '</table></div></div>';
        c.innerHTML = html;
    } catch (e) {
        c.innerHTML = `<div class="empty-state" style="color:var(--c-danger)">Ошибка: ${esc(e.message)}</div>`;
    }
}

function filterStatsTable() {
    const fApp = $('stats-f-app')?.value || '';
    const fUser = $('stats-f-user')?.value || '';
    document.querySelectorAll('#stats-table tr[data-i]').forEach(tr => {
        const r = _statsAggRows[+tr.dataset.i] || {};
        const matchApp = !fApp || r.app === fApp;
        const matchUser = !fUser || r.user === fUser;
        tr.style.display = (matchApp && matchUser) ? '' : 'none';
    });
}

/* ══════════════════════════════════════════════════════════════════
 * LEADERBOARD TAB — by time spent, expandable
 * ═════════════════════════════════════════════════════════════════ */
async function renderBoardTab() {
    const c = $('board-content');
    c.innerHTML = '<div class="empty-state"><div class="loader-spin" style="margin:0 auto"></div></div>';
    try {
        const res = await apiRead('sys_Logs!A2:E5000');
        const sessions = (res.values || []).filter(r => r[0] && r[3] === 'session');
        if (!sessions.length) {
            c.innerHTML = '<div class="empty-state"><div class="empty-ico">🏆</div>Нет данных для рейтинга</div>';
            return;
        }

        // Aggregate per user
        const userMap = {};
        sessions.forEach(r => {
            const user = r[1] || '?', app = r[2] || '?', sec = parseInt(r[4]) || 0;
            if (!userMap[user]) userMap[user] = { totalSec: 0, apps: {} };
            userMap[user].totalSec += sec;
            if (!userMap[user].apps[app]) userMap[user].apps[app] = 0;
            userMap[user].apps[app] += sec;
        });

        const sorted = Object.entries(userMap).sort((a, b) => b[1].totalSec - a[1].totalSec);

        let html = '';
        if (!currentUser) {
            html += `<div style="margin:12px 16px 0;padding:12px 16px;background:var(--surface-2);border:1px solid var(--border-hi);border-radius:var(--radius-sm);text-align:center">
                <div style="font-size:.82rem;color:var(--text);margin-bottom:8px">💡 Вы играете как <b>Гость</b>. Зарегистрируйтесь или войдите, чтобы ваши результаты сохранялись в общий рейтинг!</div>
                <button class="btn-primary" onclick="showView('login')" style="display:inline-block;width:auto;padding:8px 18px;font-size:.8rem">🔑 Войти / Регистрация</button>
            </div>`;
        }
        html += '<div class="board-list">';
        sorted.forEach(([user, data], i) => {
            const pos = i + 1;
            const posClass = pos <= 3 ? ' top' + pos : '';
            const isSelf = user === currentUser?.login;
            const appEntries = Object.entries(data.apps).sort((a, b) => b[1] - a[1]);

            html += `<div class="board-item${isSelf ? ' self' : ''}">
                <div class="board-head" onclick="this.nextElementSibling.classList.toggle('open')">
                    <div class="board-pos${posClass}">${pos}</div>
                    <div class="board-info">
                        <div class="board-name">${esc(user)}${isSelf ? '<span class="role-tag">вы</span>' : ''}</div>
                        <div class="board-meta">${appEntries.length} приложений · ${sessions.filter(r => r[1] === user).length} сессий</div>
                    </div>
                    <div class="board-time">${formatDuration(data.totalSec)}</div>
                </div>
                <div class="board-expand">`;
            appEntries.forEach(([app, sec]) => {
                html += `<div class="board-app-row"><span>${esc(app)}</span><span>${formatDuration(sec)}</span></div>`;
            });
            html += '</div></div>';
        });
        html += '</div>';
        c.innerHTML = html;
    } catch (e) {
        c.innerHTML = `<div class="empty-state" style="color:var(--c-danger)">Ошибка: ${esc(e.message)}</div>`;
    }
}

/* ══════════════════════════════════════════════════════════════════
 * DATA TAB — Full CRUD on all sheets
 * ═════════════════════════════════════════════════════════════════ */
function renderDataTab() {
    if (_dataViewSheet) { renderDataSheet(); return; }
    const c = $('data-content');
    if (!_dbSheetCache || !_dbSheetCache.size) {
        c.innerHTML = '<div class="empty-state"><div class="empty-ico">📚</div>Нет листов. Откройте настройки и инициализируйте БД.</div>';
        return;
    }
    // Group sheets by prefix
    const groups = {};
    for (const name of _dbSheetCache) {
        const prefix = name.includes('_') ? name.split('_')[0] : 'other';
        if (!groups[prefix]) groups[prefix] = [];
        groups[prefix].push(name);
    }

    const isAdmin = currentUser?.role === 'admin';
    _dataSheetList = [];
    let html = '<div class="data-sheets">';
    for (const [prefix, sheets] of Object.entries(groups).sort()) {
        html += `<div class="data-sheet-group"><div class="data-sheet-group-title">${esc(prefix)}</div>`;
        sheets.sort().forEach(name => {
            const idx = _dataSheetList.push(name) - 1;
            html += `<div class="data-sheet-item" onclick="openDataSheetAt(${idx})">
                <span class="ico">📄</span><span class="data-sheet-name">${esc(name)}</span><span class="data-sheet-arrow">→</span>
            </div>`;
        });
        html += '</div>';
    }
    html += `<div style="padding:12px 0">
        ${isAdmin ? '<button class="panel-btn accent" onclick="createNewSheet()">+ Создать новый лист</button>' : ''}
        <button class="panel-btn" onclick="refreshDataSheets()">🔄 Обновить список</button>
    </div></div>`;
    c.innerHTML = html;
}

function openDataSheetAt(idx) { const name = _dataSheetList[idx]; if (name !== undefined) openDataSheet(name); }
function reloadDataSheet()    { if (_dataViewSheet) openDataSheet(_dataViewSheet); }

async function openDataSheet(name) {
    _dataViewSheet = name;
    const c = $('data-content');
    c.innerHTML = '<div class="empty-state"><div class="loader-spin" style="margin:0 auto"></div></div>';
    try {
        const res = await apiRead(`${name}!A1:ZZ5000`);
        const all = res.values || [];
        _dataHeaders = all.length > 0 ? all[0] : [];
        _dataRows = all.slice(1);
        renderDataSheet();
    } catch (e) {
        c.innerHTML = `<div class="data-back" onclick="closeDataSheet()">← Назад к листам</div><div class="empty-state" style="color:var(--c-danger)">Ошибка: ${esc(e.message)}</div>`;
    }
}

function closeDataSheet() { _dataViewSheet = null; renderDataTab(); }

function renderDataSheet() {
    const c = $('data-content');
    const name = _dataViewSheet;
    const sheetId = _dbSheetMeta?.get(name);
    const isAdmin = currentUser?.role === 'admin';

    // В обработчики передаются только индексы строк/столбцов — значения ячеек в разметку не попадают
    let html = `<div class="data-back" onclick="closeDataSheet()">← ${esc(name)}</div>`;
    html += `<div class="data-toolbar">
        <button class="cache-btn" onclick="addDataRow()">+ Строка</button>
        <button class="cache-btn" onclick="reloadDataSheet()">🔄 Обновить</button>
        ${isAdmin && sheetId !== undefined ? `<button class="cache-btn dn" onclick="deleteCurrentSheet()">🗑 Удалить лист</button>` : ''}
    </div>`;

    if (!_dataHeaders.length && !_dataRows.length) {
        html += '<div class="empty-state">Лист пуст</div>';
    } else {
        html += '<div style="flex:1;overflow:auto;padding:0 12px 16px"><div class="table-scroll"><table class="data-table">';
        if (_dataHeaders.length) {
            html += '<tr><th>#</th>';
            _dataHeaders.forEach(h => { html += `<th>${esc(h)}</th>`; });
            html += '<th></th></tr>';
        }
        _dataRows.forEach((row, i) => {
            const rowNum = i + 2; // 1-indexed, row 1 is header
            html += `<tr><td style="color:var(--text-3);font-size:.65rem">${rowNum}</td>`;
            const maxCols = Math.max(_dataHeaders.length, row.length);
            for (let col = 0; col < maxCols; col++) {
                const val = row[col] || '';
                html += `<td class="ellipsis" ondblclick="editDataCell(this,${i},${col})" title="${esc(val)}" style="cursor:text">${esc(val)}</td>`;
            }
            html += `<td>${isAdmin && sheetId !== undefined ? `<button style="background:none;border:none;color:var(--c-danger);cursor:pointer;font-size:.8rem" onclick="deleteDataRow(${rowNum})" title="Удалить строку">✕</button>` : ''}</td></tr>`;
        });
        html += '</table></div></div>';
    }
    c.innerHTML = html;
}

function colToLetter(col) {
    let s = '';
    col++;
    while (col > 0) { col--; s = String.fromCharCode(65 + (col % 26)) + s; col = Math.floor(col / 26); }
    return s;
}

function editDataCell(td, rowIdx, colIdx) {
    const sheet   = _dataViewSheet;
    const row     = _dataRows[rowIdx];
    if (!sheet || !row) return;
    const cellRef = colToLetter(colIdx) + (rowIdx + 2);
    const oldVal  = row[colIdx] || '';
    const input = document.createElement('input');
    input.className = 'data-cell-edit';
    input.value = oldVal;
    td.textContent = '';
    td.appendChild(input);
    input.focus();
    input.select();
    const save = async () => {
        const newVal = input.value;
        td.textContent = newVal;
        if (newVal !== oldVal) {
            try { await apiUpdate(`${sheet}!${cellRef}`, newVal); row[colIdx] = newVal; td.title = newVal; toast('✓ Сохранено', 'ok'); }
            catch (e) { toast('Ошибка: ' + e.message, 'err'); td.textContent = oldVal; }
        }
    };
    input.addEventListener('blur', save);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); if (e.key === 'Escape') { td.textContent = oldVal; } });
}

async function addDataRow() {
    const name = _dataViewSheet;
    if (!name) return;
    const colCount = Math.max(_dataHeaders.length, 1);
    const emptyRow = Array(colCount).fill('');
    showLoader(true);
    try {
        await apiAppend(`${name}!A1`, [emptyRow]);
        toast('✓ Строка добавлена', 'ok');
        await openDataSheet(name);
    } catch (e) { toast('Ошибка: ' + e.message, 'err'); }
    showLoader(false);
}

async function deleteDataRow(rowNum) {
    const sheet   = _dataViewSheet;
    const sheetId = _dbSheetMeta?.get(sheet);
    if (!sheet || sheetId === undefined) return;
    if (!confirm(`Удалить строку ${rowNum}?`)) return;
    showLoader(true);
    try {
        await gasCall('deleteRows', { sheetId, startIndex: rowNum - 1, endIndex: rowNum });
        toast('✓ Строка удалена', 'ok');
        await openDataSheet(sheet);
    } catch (e) { toast('Ошибка: ' + e.message, 'err'); }
    showLoader(false);
}

async function createNewSheet() {
    const name = prompt('Имя нового листа (латиница, цифры, _):');
    if (!name) return;
    try { validateSheetName(name); } catch (e) { toast(e.message, 'err'); return; }
    showLoader(true);
    try {
        await gasCall('addSheets', { titles: [name] });
        await refreshDbCache();
        toast('✓ Лист создан: ' + name, 'ok');
        renderDataTab();
    } catch (e) { toast('Ошибка: ' + e.message, 'err'); }
    showLoader(false);
}

async function deleteCurrentSheet() {
    const name    = _dataViewSheet;
    const sheetId = _dbSheetMeta?.get(name);
    if (!name || sheetId === undefined) return;
    if (!confirm(`Удалить лист "${name}" полностью?`)) return;
    showLoader(true);
    try {
        await gasCall('deleteSheet', { sheetId });
        await refreshDbCache();
        _dataViewSheet = null;
        toast('✓ Лист удалён', 'ok');
        renderDataTab();
    } catch (e) { toast('Ошибка: ' + e.message, 'err'); }
    showLoader(false);
}

async function refreshDataSheets() {
    showLoader(true);
    try { await refreshDbCache(); renderDataTab(); toast('✓ Обновлено', 'ok'); }
    catch (e) { toast('Ошибка: ' + e.message, 'err'); }
    showLoader(false);
}

async function loadAdminUsers() {
    const c = $('admin-users');
    if (!c) return;
    try {
        const res = await apiRead('sys_Users!A2:H5000');
        _adminUsers = res.values || [];
        if (!_adminUsers.length) {
            c.innerHTML = '<p style="color:var(--text-2);font-size:.82rem">Нет пользователей</p>';
            return;
        }
        let html = '<div class="users-list">';
        _adminUsers.forEach((r, i) => {
            const [id, email, pwd, role, xp, created, status, name] = [...r, '', '', '', '', '', '', '', ''];
            const isSelf = email === currentUser?.login;
            const isBlocked = status === 'blocked';
            html += `<div class="user-row">
                <span class="u-email">${esc(name ? name + ' · ' + email : email)}</span>
                <span class="u-role ${role === 'admin' ? 'admin' : ''}">${esc(role || 'player')}</span>
                ${isBlocked ? '<span style="color:var(--c-danger);font-size:.75rem">⛔ заблокирован</span>' : ''}
                <div class="u-meta">XP: ${xp || 0} · ${created ? formatTs(created) : '—'}</div>
                ${isSelf ? '' : `<div class="u-actions">
                    <button onclick="adminToggleRole(${i})">${(role || 'player') === 'admin' ? '→player' : '→admin'}</button>
                    <button onclick="adminToggleBlock(${i})">${isBlocked ? '✓ разблок.' : '⛔ блок.'}</button>
                </div>`}
            </div>`;
        });
        html += '</div>';
        c.innerHTML = html;
    } catch (e) {
        c.innerHTML = `<p style="color:var(--c-danger);font-size:.82rem">Ошибка: ${esc(e.message)}</p>`;
    }
}

async function adminToggleRole(idx) {

async function adminToggleBlock(idx) {

/* ── Settings: Cache Management ── */
function renderSettCache(c) {
    if (_cacheEditKey !== null) { renderCacheEditor(c); return; }

    const keys = Object.keys(localStorage).sort();
    _cacheKeys = keys;
    let totalBytes = 0;
    keys.forEach(k => totalBytes += ((localStorage.getItem(k) || '').length * 2));

    let html = `
        <div class="panel-sec">
            <h3>💾 Управление кэшем</h3>
            <div class="panel-row"><span>Всего ключей</span><span class="panel-badge">${keys.length}</span></div>
            <div class="panel-row"><span>Размер</span><span class="panel-badge">~${(totalBytes / 1024).toFixed(1)} КБ</span></div>
            <button class="panel-btn accent" onclick="createCacheKey()">+ Создать новый ключ</button>
            <button class="panel-btn" onclick="clearAppCache()">🧹 Очистить кэш приложений</button>
            <button class="panel-btn danger" onclick="resetAllData()">⚠️ Сбросить ВСЕ данные</button>
        </div>
        <div class="cache-list">`;
    keys.forEach((k, i) => {
        const val = localStorage.getItem(k) || '';
        const size = (val.length * 2);
        const sizeLabel = size < 1024 ? size + ' B' : (size / 1024).toFixed(1) + ' KB';
        html += `<div class="cache-item" onclick="openCacheKeyAt(${i})">
            <span class="cache-key">${esc(k)}</span>
            <span class="cache-size">${sizeLabel}</span>
            <span style="color:var(--text-3)">→</span>
        </div>`;
    });
    html += '</div>';
    c.innerHTML = html;
}

function openCacheKey(key) { _cacheEditKey = key; renderSettingsTab(); }
function openCacheKeyAt(i) { const k = _cacheKeys[i]; if (k !== undefined) openCacheKey(k); }

function renderCacheEditor(c) {
    const key = _cacheEditKey;
    const val = localStorage.getItem(key) || '';
    let formatted = val;
    try { formatted = JSON.stringify(JSON.parse(val), null, 2); } catch {}

    c.innerHTML = `
        <div class="data-back" onclick="closeCacheEditor()">← ${esc(key)}</div>
        <div class="cache-edit">
            <textarea class="cache-edit-ta" id="cache-val">${esc(formatted)}</textarea>
            <div class="cache-actions">
                <button class="cache-btn pr" onclick="saveCacheKey()">💾 Сохранить</button>
                <button class="cache-btn dn" onclick="deleteCacheKey()">🗑 Удалить</button>
                <button class="cache-btn" onclick="closeCacheEditor()">Отмена</button>
            </div>
        </div>`;
}

function closeCacheEditor() { _cacheEditKey = null; renderSettingsTab(); }

function saveCacheKey() {
    const key = _cacheEditKey;
    const val = $('cache-val').value;
    localStorage.setItem(key, val);
    toast('✓ Сохранено: ' + key, 'ok');
    closeCacheEditor();
}

function deleteCacheKey() {
    const key = _cacheEditKey;
    if (!confirm(`Удалить ключ "${key}"?`)) return;
    localStorage.removeItem(key);
    toast('✓ Удалён: ' + key, 'ok');
    closeCacheEditor();
}

function createCacheKey() {
    const key = prompt('Имя нового ключа:');
    if (!key || !key.trim()) return;
    if (localStorage.getItem(key.trim()) !== null) {
        openCacheKey(key.trim());
    } else {
        localStorage.setItem(key.trim(), '');
        openCacheKey(key.trim());
    }
}

function clearAppCache() {
    const keep = new Set([LS_CFG, LS_USER, LS_LAUNCHES]);
    for (const k of Object.keys(localStorage)) if (!keep.has(k)) localStorage.removeItem(k);
    if ('caches' in window) caches.keys().then(names => names.forEach(n => caches.delete(n)));
    toast('Кэш приложений очищен', 'ok');
    renderSettingsTab();
}

function resetAllData() {
    if (!confirm('Удалить ВСЕ данные платформы? Потребуется настройка заново.')) return;
    localStorage.clear();
    if ('caches' in window) caches.keys().then(names => names.forEach(n => caches.delete(n)));
    location.reload();
}
