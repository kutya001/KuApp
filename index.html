function switchTab(tabName) {
    if (!currentUser && ['board', 'data', 'settings'].includes(tabName)) {
        tabName = 'apps';
    }
    activeTab = tabName;
    document.querySelectorAll('.side-item, .bnav-item').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tabName);
    });
    document.querySelectorAll('.tab-panel').forEach(p => {
        p.classList.toggle('active', p.id === 'tab-' + tabName);
    });
    const titles = { apps: 'Каталог', stats: 'Статистика', board: 'Рейтинг', data: 'Справочники', settings: 'Настройки' };
    $('content-title').textContent = titles[tabName] || '';
    document.querySelector('.plat-header')?.classList.toggle('on-apps', tabName === 'apps');
    if (tabName === 'stats') renderStatsTab();
    else if (tabName === 'board') renderBoardTab();
    else if (tabName === 'data') renderDataTab();
    else if (tabName === 'settings') renderSettingsTab();
}

/* ══════════════════════════════════════════════════════════════════
 * APP LAUNCH / SESSION TRACKING
 * Приложение открывается в новом <iframe> (а не сменой src у старого): так запуск не добавляет
 * записей в историю браузера, и системная кнопка «Назад» на телефоне закрывает игру, а не всё приложение.
 * ═════════════════════════════════════════════════════════════════ */
let _appMeta = {};        // id → запись каталога (для заставки, «Продолжить», статистики)
let _splashShownAt = 0;
let _skipPop = false;

function appOpen() { return $('immersive-container').classList.contains('open'); }
function appName(id) { return _appMeta[id]?.name || id; }

function mountFrame(src) {
    const fr = document.createElement('iframe');
    fr.id = 'app-iframe';
    fr.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-modals allow-downloads');
    fr.setAttribute('allowfullscreen', '');
    if (src) {
        fr.addEventListener('load', () => {
            hideSplash();
            // фокус в игру — клавиатура работает сразу, без лишнего клика
            try { fr.focus({ preventScroll: true }); fr.contentWindow.focus(); } catch {}
        }, { once: true });
        fr.src = src;
    }
    $('app-iframe').replaceWith(fr);
}

function showSplash(g) {
    const s = $('app-splash'), ico = $('splash-ico');
    s.setAttribute('style', cardVars(g));
    ico.textContent = g.icon || '🎮';
    ico.classList.toggle('txt', !isEmoji(g.icon || '🎮'));
    $('splash-name').textContent = g.name || '';
    clearTimeout(s._t);
    s.classList.remove('hide');
    s.hidden = false;
    _splashShownAt = Date.now();
    s._t = setTimeout(() => hideSplash(), 8000);       // страховка, если load не придёт
}
function hideSplash(now) {
    const s = $('app-splash');
    clearTimeout(s._t);
    if (now || s.hidden) { s.hidden = true; return; }
    const wait = Math.max(0, 380 - (Date.now() - _splashShownAt));   // не мигать на быстрых загрузках
    s._t = setTimeout(() => {
        s.classList.add('hide');
        s._t = setTimeout(() => { s.hidden = true; }, 280);
    }, wait);
}

function launchApp(file, appId) {
    if (!file) return;
    if (appOpen()) closeApp(true);
    const g = _appMeta[appId] || { id: appId };
    currentSession = { appId, startTime: Date.now() };
    setLastLaunch(appId);
    $('update-bar').classList.remove('show');
    showSplash(g);
    $('immersive-container').classList.add('open');
    mountFrame(/^https?:\/\//.test(file) ? file : `./apps/${file}`);
    try { history.pushState({ kuApp: appId }, ''); } catch {}
}

/** Закрыть приложение. fromHistory — вызвано переходом «Назад» (popstate): запись истории уже снята. */
function closeApp(fromHistory) {
    if (!appOpen()) return;
    if (currentSession.appId && currentSession.startTime) {
        const durationSec = Math.round((Date.now() - currentSession.startTime) / 1000);
        if (durationSec > 5) window.PlatformAPI.system.logSession(currentSession.appId, durationSec);
    }
    currentSession = { appId: null, startTime: null };
    $('immersive-container').classList.remove('open');
    mountFrame('');
    hideSplash(true);
    if (fromHistory !== true) { try { if (history.state && history.state.kuApp) { _skipPop = true; history.back(); } } catch {} }
    if (activeTab === 'apps') renderAppsGrid(false);
}

// страницу перезагрузили при открытой игре — метка игры в истории больше не нужна
try { if (history.state && history.state.kuApp) history.replaceState(null, ''); } catch {}

$('btn-float-back').addEventListener('click', () => closeApp());
window.addEventListener('popstate', () => {
    if (_skipPop) { _skipPop = false; return; }      // запись истории сняли сами при закрытии кнопкой «←»
    if (appOpen()) closeApp(true);
});

/* ══════════════════════════════════════════════════════════════════
 * APPS GRID — каталог: «Продолжить», избранное, недавние, фильтры, карточки
 * ═════════════════════════════════════════════════════════════════ */
/* Запасной список, если apps/index.json не загрузился или в нём (старая версия из кэша) нет этих приложений */
const BUILTIN_APPS = [
    { id: 'trainer',    name: 'Тренер',  icon: '🏋️', desc: 'Таймер тренировок по программам: McGill Big 3, HIIT, реабилитация плеча.', file: 'trainer.html',    color: '#51f58b' },
    { id: 'dictionary', name: 'Словарь', icon: '📖', desc: 'Учи иностранные слова: карточки, тесты и рейтинг.',                      file: 'dictionary.html', color: '#5b8cff' }
];
/* Служебная плитка — видна только администратору */
const ADMIN_APPS = [
    { id: 'gas_webapp', name: 'GAS WebApp', icon: '🌐', desc: 'Статус бэкенда Google Apps Script.', file: HARDCODED_GAS_URL, color: '#7aa2ff' }
];

async function fetchAndRenderApps() {
    let categories = [];
    try {
        const res = await fetch('./apps/index.json');
        if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data.categories)) {
                categories = data.categories
                    .map(cat => ({ ...cat, games: (cat.games || []).filter(g => g && g.file && g.name) }))
                    .filter(cat => cat.games.length > 0);
            }
        }
    } catch {}
    const have = new Set();
    categories.forEach(c => c.games.forEach(g => have.add(g.id || g.file)));
    const missing = BUILTIN_APPS.filter(a => !have.has(a.id));
    if (missing.length) {
        const tools = categories.find(c => c.id === 'tools');
        if (tools) tools.games.push(...missing);
        else categories.push({ id: 'tools', label: '🧰 Приложения', games: missing });
    }
    if ((currentUser?.role || '').toLowerCase() === 'admin') {
        categories.push({ id: 'admin', label: '🔑 Администратору', games: ADMIN_APPS });
    }
    appsData = categories;
    _appMeta = {};
    categories.forEach(c => c.games.forEach(g => { _appMeta[g.id || g.file] = g; }));
    renderChips();
    renderAppsGrid();
    if (!_precacheAsked) { _precacheAsked = true; setTimeout(precacheCatalog, 5000); }
}

/* Дозагрузка всех игр каталога в кэш Service Worker — после первого визита они открываются и без сети */
let _precacheAsked = false;
function precacheCatalog() {
    if (!('serviceWorker' in navigator) || !appsData) return;
    if (navigator.connection && navigator.connection.saveData) return;      // включена экономия трафика
    const urls = allGames().map(g => g.file).filter(f => f && !/^https?:\/\//.test(f)).map(f => './apps/' + f);
    navigator.serviceWorker.ready
        .then(reg => { if (reg.active) reg.active.postMessage({ type: 'PRECACHE', urls }); })
        .catch(() => {});
}

/* Игры с режимом «по сети» (kunet.js) — запасной список для каталога без поля tags */
const ONLINE_GAMES = new Set(['tictac', 'reversi', 'wallrush', 'billiard', 'sudoku']);
const TAG_CHIPS = { fav: '★ Избранное', online: '🌐 По сети', duo: '👥 Вдвоём', daily: '📅 Игра дня' };
const CARD_PALETTE = ['#00e5ff', '#ffd60a', '#c77dff', '#51f58b', '#5b8cff', '#ff5d7d', '#ff9f43'];
let activeCat = 'all';

function initials(name) {
    const s = String(name || '').trim();
    if (!s) return 'Г';
    const parts = s.split(/[\s_\-·]+/).filter(Boolean);
    const ini = ((parts[0]?.[0] || '') + (parts[1]?.[0] || '')).toUpperCase();
    return ini || s[0].toUpperCase();
}

function allGames() {
    const a = [];
    (appsData || []).forEach(cat => (cat.games || []).forEach(g => a.push(g)));
    return a;
}
function gameId(g) { return g.id || g.file; }
function tagsOf(g) {
    const t = Array.isArray(g.tags) ? g.tags : [];
    return ONLINE_GAMES.has(g.id) && !t.includes('online') ? [...t, 'online'] : t;
}
function isEmoji(s) { try { return /\p{Extended_Pictographic}/u.test(s); } catch { return true; } }

/** Цвет карточки: поле color каталога или цвет палитры по id. Возвращает CSS-переменные --c, --c-a, --c-b. */
function cardVars(g) {
    let c = String(g.color || '');
    if (!/^#[0-9a-f]{6}$/i.test(c)) {
        let h = 0;
        for (const ch of String(gameId(g) || '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
        c = CARD_PALETTE[h % CARD_PALETTE.length];
    }
    const r = parseInt(c.slice(1, 3), 16), gr = parseInt(c.slice(3, 5), 16), b = parseInt(c.slice(5, 7), 16);
    return `--c:${c};--c-a:rgba(${r},${gr},${b},.32);--c-b:rgba(${r},${gr},${b},.13)`;
}

/* ── Избранное ── */
function getFavs() {
    try { const a = JSON.parse(localStorage.getItem(LS_FAVS) || '[]'); return Array.isArray(a) ? a.filter(x => typeof x === 'string') : []; }
    catch { return []; }
}
function isFav(id) { return getFavs().includes(id); }
function toggleFav(id) {
    const a = getFavs(), i = a.indexOf(id);
    if (i >= 0) a.splice(i, 1); else a.unshift(id);
    try { localStorage.setItem(LS_FAVS, JSON.stringify(a.slice(0, 100))); } catch {}
    if (activeCat === 'fav' && !a.length) activeCat = 'all';
    renderChips();
    renderAppsGrid(false);
}

/* Фильтры над каталогом: все, избранное, по сети, вдвоём, игра дня, затем категории */
function renderChips() {
    const el = $('apps-chips');
    if (!el) return;
    const all = allGames();
    const chips = [{ id: 'all', label: 'Все', n: all.length }];
    const favN = all.filter(g => isFav(gameId(g))).length;
    if (favN) chips.push({ id: 'fav', label: TAG_CHIPS.fav, n: favN });
    ['online', 'duo', 'daily'].forEach(t => {
        const n = all.filter(g => tagsOf(g).includes(t)).length;
        if (n) chips.push({ id: t, label: TAG_CHIPS[t], n });
    });
    const cats = (appsData || []).map(c => ({ id: c.id, label: String(c.label || '').replace(/^[^\p{L}\p{N}]+/u, '').trim() || c.id, n: (c.games || []).length }));
    if (!chips.some(c => c.id === activeCat) && !cats.some(c => c.id === activeCat)) activeCat = 'all';
    const one = c => `<button class="chip${activeCat === c.id ? ' active' : ''}" data-cat="${esc(c.id)}" role="tab" aria-selected="${activeCat === c.id}">${esc(c.label)}<span class="n">${c.n}</span></button>`;
    el.innerHTML = chips.map(one).join('') + (cats.length ? '<span class="chip-sep"></span>' + cats.map(one).join('') : '');
    el.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
        activeCat = b.dataset.cat;
        if (searchQuery) { searchQuery = ''; const inp = $('apps-search'); if (inp) inp.value = ''; const cl = $('apps-search-clear'); if (cl) cl.style.display = 'none'; }
        renderChips();
        renderAppsGrid();
        $('apps-scroll').scrollTop = 0;
    }));
    const act = el.querySelector('.chip.active');
    if (act && act.scrollIntoView) { try { act.scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch {} }
}

function iconHtml(g, cls) {
    const ico = g.icon || '🎮';
    return `<span class="${cls}${isEmoji(ico) ? '' : ' txt'}">${esc(ico)}</span>`;
}

function tileHtml(g, i) {
    const appId = gameId(g);
    const t = tagsOf(g);
    const meta = [];
    if (t.includes('online')) meta.push('<span class="badge net">по сети</span>');
    else if (t.includes('duo')) meta.push('<span class="badge duo">вдвоём</span>');
    if (t.includes('daily')) meta.push('<span class="badge day">игра дня</span>');
    const fav = isFav(appId);
    return `<div class="g-card" style="${cardVars(g)};--i:${Math.min(i || 0, 16)}" data-file="${esc(g.file)}" data-id="${esc(appId)}" role="button" tabindex="0" aria-label="${esc(g.name)}">
        <button class="g-fav${fav ? ' on' : ''}" data-fav="${esc(appId)}" aria-pressed="${fav}" aria-label="${fav ? 'Убрать из избранного' : 'В избранное'}: ${esc(g.name)}" title="${fav ? 'Убрать из избранного' : 'В избранное'}">${fav ? '★' : '☆'}</button>
        <div class="g-art">${iconHtml(g, 'g-ico')}</div>
        <div class="g-info">
            <div class="g-name">${esc(g.name)}</div>
            <div class="g-desc">${esc(g.desc || '')}</div>
            ${meta.length ? `<div class="g-tags">${meta.join('')}</div>` : ''}
        </div>
    </div>`;
}

function rowHtml(title, list, withTime) {
    return `<div class="app-category"><div class="app-cat-label">${esc(title)}</div><div class="recent-row">` +
        list.map(g => {
            const id = gameId(g);
            return `<div class="recent-card" style="${cardVars(g)}" data-file="${esc(g.file)}" data-id="${esc(id)}" role="button" tabindex="0" aria-label="${esc(g.name)}">
                ${iconHtml(g, 'recent-ico')}
                <div class="recent-name">${esc(g.name)}</div>
                ${withTime ? `<div class="recent-time">${esc(formatRelative(getLastLaunch(id)))}</div>` : ''}
            </div>`;
        }).join('') + '</div></div>';
}

function continueHtml(g) {
    const id = gameId(g);
    return `<div class="continue" style="${cardVars(g)}" data-file="${esc(g.file)}" data-id="${esc(id)}" role="button" tabindex="0" aria-label="Продолжить: ${esc(g.name)}">
        <div class="continue-art">${iconHtml(g, '')}</div>
        <div class="continue-body">
            <div class="continue-lbl">Продолжить</div>
            <div class="continue-name">${esc(g.name)}</div>
            <div class="continue-time">${esc(formatRelative(getLastLaunch(id)))}</div>
        </div>
        <div class="continue-cta">▶<span>Играть</span></div>
    </div>`;
}

function heroHtml() {
    if (!currentUser) {
        return `<div class="hero">
            <div class="avatar guest">Г</div>
            <div class="hero-body">
                <div class="hero-title">Привет, гость!</div>
                <div class="hero-sub">Играйте без входа. Код игрока откроет игры по сети и общий рейтинг.</div>
            </div>
            <button class="hero-cta" onclick="showView('login')">Войти</button>
        </div>`;
    }
    const name = currentUser.name || currentUser.playerId || currentUser.login;
    const badges = [`<span class="badge xp">⭐ ${fmt(currentUser.total_xp || 0)} XP</span>`];
    if (currentUser.role === 'admin') badges.unshift('<span class="badge admin">🔑 администратор</span>');
    if (currentUser.playerId) badges.push(`<span class="badge">ID ${esc(currentUser.playerId)}</span>`);
    return `<div class="hero">
        <div class="avatar">${esc(initials(name))}</div>
        <div class="hero-body">
            <div class="hero-title">Привет, ${esc(name)}!</div>
            <div class="hero-badges">${badges.join('')}</div>
        </div>
    </div>`;
}

function normText(s) { return String(s || '').toLowerCase().replace(/ё/g, 'е'); }

/** Перерисовать каталог. animate === false — без анимации появления (поиск, избранное, возврат из игры). */
function renderAppsGrid(animate) {
    const el = $('apps-body');
    if (!el) return;
    const q = normText(searchQuery).trim();
    const tagFilter = !q && Object.prototype.hasOwnProperty.call(TAG_CHIPS, activeCat) ? activeCat : '';
    const home = !q && activeCat === 'all';
    const all = allGames();
    let html = '', idx = 0;

    if (home) {
        const recent = all
            .filter(g => { const t = getLastLaunch(gameId(g)); return t && Date.now() - t < 30 * 86400 * 1000; })
            .sort((a, b) => (getLastLaunch(gameId(b)) || 0) - (getLastLaunch(gameId(a)) || 0))
            .slice(0, 9);
        html += `<div class="hub-duo">${heroHtml()}${recent.length ? continueHtml(recent[0]) : ''}</div>`;
        const favs = getFavs().map(id => _appMeta[id]).filter(Boolean);
        if (favs.length) html += rowHtml('★ Избранное', favs, false);
        if (recent.length > 1) html += rowHtml('🕘 Недавние', recent.slice(1), true);
    }

    if (q || tagFilter) {
        let list = all;
        if (tagFilter === 'fav') list = list.filter(g => isFav(gameId(g)));
        else if (tagFilter) list = list.filter(g => tagsOf(g).includes(tagFilter));
        if (q) {
            const catOf = new Map();
            (appsData || []).forEach(c => (c.games || []).forEach(g => catOf.set(g, normText(c.label))));
            list = list.filter(g => normText(g.name).includes(q) || normText(g.desc).includes(q) || normText(g.id).includes(q) || (catOf.get(g) || '').includes(q));
        }
        if (list.length) {
            const title = q ? '🔍 Найдено' : TAG_CHIPS[tagFilter];
            html += `<div class="app-category"><div class="app-cat-label">${esc(title)}<span class="app-cat-count">${list.length}</span></div><div class="apps-grid">${list.map(g => tileHtml(g, idx++)).join('')}</div></div>`;
        }
    } else {
        (appsData || []).forEach(cat => {
            if (activeCat !== 'all' && cat.id !== activeCat) return;
            const apps = cat.games || [];
            if (!apps.length) return;
            html += `<div class="app-category"><div class="app-cat-label">${esc(cat.label)}<span class="app-cat-count">${apps.length}</span></div><div class="apps-grid">${apps.map(g => tileHtml(g, idx++)).join('')}</div></div>`;
        });
    }

    if (!idx) {
        html = q
            ? `<div class="apps-empty"><b>🔍</b>Ничего не найдено по запросу «${esc(searchQuery.trim())}»</div>`
            : (appsData ? `<div class="apps-empty"><b>☆</b>Здесь пока пусто</div>` : `<div class="apps-empty">Загрузка…</div>`);
    } else if (home) {
        html += `<div class="apps-foot">☆ на карточке — добавить в избранное · 🎲 — случайная игра</div>`;
    }
    el.classList.toggle('quiet', animate === false);
    el.innerHTML = html;
}

/* Один обработчик на весь каталог: звезда — избранное, карточка — запуск */
(function bindCatalog() {
    const el = $('apps-body');
    if (!el) return;
    el.addEventListener('click', e => {
        const fav = e.target.closest('[data-fav]');
        if (fav) { e.preventDefault(); e.stopPropagation(); toggleFav(fav.dataset.fav); return; }
        const tile = e.target.closest('[data-file]');
        if (tile) launchApp(tile.dataset.file, tile.dataset.id || tile.dataset.file);
    });
    el.addEventListener('keydown', e => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        const tile = e.target.closest('[data-file]');
        if (!tile || e.target !== tile) return;      // Enter на звезде обрабатывает сама кнопка
        e.preventDefault();
        launchApp(tile.dataset.file, tile.dataset.id || tile.dataset.file);
    });
})();

/** 🎲 Случайная игра из показанных на экране (служебные приложения не выпадают). */
function launchRandom() {
    const shown = [...document.querySelectorAll('#apps-body .g-card')]
        .map(c => _appMeta[c.dataset.id]).filter(Boolean)
        .filter(g => !(appsData || []).some(c => (c.id === 'tools' || c.id === 'admin') && c.games.includes(g)));
    const last = Object.entries((() => { try { return JSON.parse(localStorage.getItem(LS_LAUNCHES) || '{}'); } catch { return {}; } })())
        .sort((a, b) => b[1] - a[1])[0]?.[0];
    const pool = shown.length > 1 ? shown.filter(g => gameId(g) !== last) : shown;
    if (!pool.length) { toast('Нет игр для выбора', ''); return; }
    const g = pool[Math.floor(Math.random() * pool.length)];
    launchApp(g.file, gameId(g));
}

const searchInp = $('apps-search');
const clearBtn = $('apps-search-clear');
function setSearch(v) {
    searchQuery = v;
    if (clearBtn) clearBtn.style.display = searchQuery ? 'flex' : 'none';
    if (searchQuery.trim() && activeCat !== 'all') { activeCat = 'all'; renderChips(); }   // поиск идёт по всему каталогу
    renderAppsGrid(false);
}
if (searchInp) {
    searchInp.addEventListener('input', e => setSearch(e.target.value));
    searchInp.addEventListener('keydown', e => {
        if (e.key === 'Escape' && searchInp.value) { e.stopPropagation(); searchInp.value = ''; setSearch(''); }
        if (e.key === 'Enter') {                      // Enter запускает единственный найденный результат
            const cards = document.querySelectorAll('#apps-body .g-card');
            if (searchQuery.trim() && cards.length === 1) cards[0].click();
            else searchInp.blur();
        }
    });
}
if (clearBtn) {
    clearBtn.addEventListener('click', () => {
        if (searchInp) { searchInp.value = ''; searchInp.focus(); }
        setSearch('');
    });
}
$('btn-random')?.addEventListener('click', launchRandom);

/** Экран ошибки с кнопкой «Повторить» (retry — имя глобальной функции). */
function errorStateHtml(e, retry) {
    return `<div class="empty-state"><div class="empty-ico">📡</div>${esc(e?.message || 'Ошибка')}<br>` +
        `<button class="retry-btn" onclick="${retry}()">Повторить</button></div>`;
}

/* ══════════════════════════════════════════════════════════════════
 * STATS TAB — Session statistics
 * ═════════════════════════════════════════════════════════════════ */
async function renderStatsTab() {
    const c = $('stats-content');
    c.innerHTML = '<div class="empty-state"><div class="loader-spin" style="margin:0 auto"></div></div>';
    try {
        const res = await apiRead('sys_Logs!A2:E5000');
        const allRows = (res.values || []).filter(r => r[0] && r[3] === 'session');

        if (!allRows.length) {
            c.innerHTML = '<div class="empty-state"><div class="empty-ico">📊</div>Нет данных о сессиях</div>';
            return;
        }

        // Summary cards
        const totalSessions = allRows.length;
        const totalSec = allRows.reduce((s, r) => s + (parseInt(r[4]) || 0), 0);
        const uniqueUsers = new Set(allRows.map(r => r[1])).size;
        const uniqueApps = new Set(allRows.map(r => r[2])).size;

        // Per-user per-app aggregation
        const agg = {};
        allRows.forEach(r => {
            const user = r[1] || '?', app = r[2] || '?', sec = parseInt(r[4]) || 0, ts = r[0];
            const key = user + '|' + app;
            if (!agg[key]) agg[key] = { user, app, count: 0, totalSec: 0, lastTs: '' };
            agg[key].count++;
            agg[key].totalSec += sec;
            if (ts > agg[key].lastTs) agg[key].lastTs = ts;
        });

        const rows = Object.values(agg).sort((a, b) => b.totalSec - a.totalSec);
        _statsAggRows = rows;   // строки таблицы адресуются индексом (data-i), а не значениями

        // Filters
        const appIds = [...new Set(allRows.map(r => r[2]).filter(Boolean))];
        const users  = [...new Set(allRows.map(r => r[1]).filter(Boolean))];

        let html = `
        <div class="stat-cards">
            <div class="stat-card"><div class="stat-card-val">${totalSessions}</div><div class="stat-card-lbl">Сессий</div></div>
            <div class="stat-card"><div class="stat-card-val">${formatDuration(totalSec)}</div><div class="stat-card-lbl">Общее время</div></div>
            <div class="stat-card"><div class="stat-card-val">${uniqueUsers}</div><div class="stat-card-lbl">Пользователей</div></div>
            <div class="stat-card"><div class="stat-card-val">${uniqueApps}</div><div class="stat-card-lbl">Приложений</div></div>
        </div>
        <div class="logs-filters">
            <select id="stats-f-app" onchange="filterStatsTable()"><option value="">Все приложения</option>${appIds.map(id => `<option value="${esc(id)}">${esc(appName(id))}</option>`).join('')}</select>
            <select id="stats-f-user" onchange="filterStatsTable()"><option value="">Все пользователи</option>${users.map(u => `<option value="${esc(u)}">${esc(displayUser(u))}</option>`).join('')}</select>
        </div>
        <div style="flex:1;overflow:auto;padding:0 16px 16px"><div class="table-scroll">
        <table class="data-table" id="stats-table">
            <tr><th>Пользователь</th><th>Приложение</th><th>Сессий</th><th>Общее время</th><th>Последний запуск</th></tr>`;
        rows.forEach((r, i) => {
            html += `<tr data-i="${i}">
                <td>${esc(displayUser(r.user))}</td>
                <td>${esc(appName(r.app))}</td>
                <td>${r.count}</td>
                <td class="nowrap">${formatDuration(r.totalSec)}</td>
                <td class="nowrap">${formatTs(r.lastTs)}</td>
            </tr>`;
        });
        html += '</table></div></div>';
        c.innerHTML = html;
    } catch (e) {
        c.innerHTML = errorStateHtml(e, 'renderStatsTab');
    }
}

function filterStatsTable() {
    const fApp = $('stats-f-app')?.value || '';
    const fUser = $('stats-f-user')?.value || '';
    document.querySelectorAll('#stats-table tr[data-i]').forEach(tr => {
        const r = _statsAggRows[+tr.dataset.i] || {};
        const matchApp = !fApp || r.app === fApp;
        const matchUser = !fUser || r.user === fUser;
        tr.style.display = (matchApp && matchUser) ? '' : 'none';
    });
}

/* ══════════════════════════════════════════════════════════════════
 * LEADERBOARD TAB — by time spent, expandable
 * ═════════════════════════════════════════════════════════════════ */
async function renderBoardTab() {
    const c = $('board-content');
    c.innerHTML = '<div class="empty-state"><div class="loader-spin" style="margin:0 auto"></div></div>';
    try {
        const res = await apiRead('sys_Logs!A2:E5000');
        const sessions = (res.values || []).filter(r => r[0] && r[3] === 'session');
        if (!sessions.length) {
            c.innerHTML = '<div class="empty-state"><div class="empty-ico">🏆</div>Нет данных для рейтинга</div>';
            return;
        }

        // Aggregate per user
        const userMap = {};
        sessions.forEach(r => {
            const user = r[1] || '?', app = r[2] || '?', sec = parseInt(r[4]) || 0;
            if (!userMap[user]) userMap[user] = { totalSec: 0, apps: {}, count: 0 };
            userMap[user].totalSec += sec;
            userMap[user].count++;
            if (!userMap[user].apps[app]) userMap[user].apps[app] = 0;
            userMap[user].apps[app] += sec;
        });

        const sorted = Object.entries(userMap).sort((a, b) => b[1].totalSec - a[1].totalSec);

        let html = '';
        if (!currentUser) {
            html += `<div style="margin:12px 16px 0;padding:12px 16px;background:var(--surface-2);border:1px solid var(--border-hi);border-radius:var(--radius-sm);text-align:center">
                <div style="font-size:.82rem;color:var(--text);margin-bottom:8px">💡 Вы играете как <b>Гость</b>. Зарегистрируйтесь или войдите, чтобы ваши результаты сохранялись в общий рейтинг!</div>
                <button class="btn-primary" onclick="showView('login')" style="display:inline-block;width:auto;padding:8px 18px;font-size:.8rem">🔑 Войти / Регистрация</button>
            </div>`;
        }
        html += '<div class="board-list">';
        sorted.forEach(([user, data], i) => {
            const pos = i + 1;
            const posClass = pos <= 3 ? ' top' + pos : '';
            const isSelf = user === currentUser?.login;
            const appEntries = Object.entries(data.apps).sort((a, b) => b[1] - a[1]);

            html += `<div class="board-item${isSelf ? ' self' : ''}">
                <div class="board-head" onclick="this.nextElementSibling.classList.toggle('open')">
                    <div class="board-pos${posClass}">${pos}</div>
                    <div class="board-info">
                        <div class="board-name">${esc(displayUser(user))}${isSelf ? '<span class="role-tag">вы</span>' : ''}</div>
                        <div class="board-meta">${appEntries.length} прилож. · ${data.count} сессий</div>
                    </div>
                    <div class="board-time">${formatDuration(data.totalSec)}</div>
                </div>
                <div class="board-expand">`;
            appEntries.forEach(([app, sec]) => {
                html += `<div class="board-app-row"><span>${esc(appName(app))}</span><span>${formatDuration(sec)}</span></div>`;
            });
            html += '</div></div>';
        });
        html += '</div>';
        c.innerHTML = html;
    } catch (e) {
        c.innerHTML = errorStateHtml(e, 'renderBoardTab');
    }
}

/* ══════════════════════════════════════════════════════════════════
 * DATA TAB — Full CRUD on all sheets
 * ═════════════════════════════════════════════════════════════════ */
function renderDataTab() {
    if (_dataViewSheet) { renderDataSheet(); return; }
    const c = $('data-content');
    if (!_dbSheetCache || !_dbSheetCache.size) {
        c.innerHTML = '<div class="empty-state"><div class="empty-ico">📚</div>Нет листов. Откройте настройки и инициализируйте БД.</div>';
        return;
    }
    // Group sheets by prefix
    const groups = {};
    for (const name of _dbSheetCache) {
        const prefix = name.includes('_') ? name.split('_')[0] : 'other';
        if (!groups[prefix]) groups[prefix] = [];
        groups[prefix].push(name);
    }

    const isAdmin = currentUser?.role === 'admin';
    _dataSheetList = [];
    let html = '<div class="data-sheets">';
    for (const [prefix, sheets] of Object.entries(groups).sort()) {
        html += `<div class="data-sheet-group"><div class="data-sheet-group-title">${esc(prefix)}</div>`;
        sheets.sort().forEach(name => {
            const idx = _dataSheetList.push(name) - 1;
            html += `<div class="data-sheet-item" onclick="openDataSheetAt(${idx})">
                <span class="ico">📄</span><span class="data-sheet-name">${esc(name)}</span><span class="data-sheet-arrow">→</span>
            </div>`;
        });
        html += '</div>';
    }
    html += `<div style="padding:12px 0">
        ${isAdmin ? '<button class="panel-btn accent" onclick="createNewSheet()">+ Создать новый лист</button>' : ''}
        <button class="panel-btn" onclick="refreshDataSheets()">🔄 Обновить список</button>
    </div></div>`;
    c.innerHTML = html;
}

function openDataSheetAt(idx) { const name = _dataSheetList[idx]; if (name !== undefined) openDataSheet(name); }
function reloadDataSheet()    { if (_dataViewSheet) openDataSheet(_dataViewSheet); }

async function openDataSheet(name) {
    _dataViewSheet = name;
    const c = $('data-content');
    c.innerHTML = '<div class="empty-state"><div class="loader-spin" style="margin:0 auto"></div></div>';
    try {
        const res = await apiRead(`${name}!A1:ZZ5000`);
        const all = res.values || [];
        _dataHeaders = all.length > 0 ? all[0] : [];
        _dataRows = all.slice(1);
        renderDataSheet();
    } catch (e) {
        c.innerHTML = `<div class="data-back" onclick="closeDataSheet()">← Назад к листам</div><div class="empty-state" style="color:var(--c-danger)">Ошибка: ${esc(e.message)}</div>`;
    }
}

function closeDataSheet() { _dataViewSheet = null; renderDataTab(); }

function renderDataSheet() {
    const c = $('data-content');
    const name = _dataViewSheet;
    const sheetId = _dbSheetMeta?.get(name);
    const isAdmin = currentUser?.role === 'admin';

    // В обработчики передаются только индексы строк/столбцов — значения ячеек в разметку не попадают
    let html = `<div class="data-back" onclick="closeDataSheet()">← ${esc(name)}</div>`;
    html += `<div class="data-toolbar">
        <button class="cache-btn" onclick="addDataRow()">+ Строка</button>
        <button class="cache-btn" onclick="reloadDataSheet()">🔄 Обновить</button>
        ${isAdmin && sheetId !== undefined ? `<button class="cache-btn dn" onclick="deleteCurrentSheet()">🗑 Удалить лист</button>` : ''}
    </div>`;

    if (!_dataHeaders.length && !_dataRows.length) {
        html += '<div class="empty-state">Лист пуст</div>';
    } else {
        html += '<div style="flex:1;overflow:auto;padding:0 12px 16px"><div class="table-scroll"><table class="data-table">';
        if (_dataHeaders.length) {
            html += '<tr><th>#</th>';
            _dataHeaders.forEach(h => { html += `<th>${esc(h)}</th>`; });
            html += '<th></th></tr>';
        }
        _dataRows.forEach((row, i) => {
            const rowNum = i + 2; // 1-indexed, row 1 is header
            html += `<tr><td style="color:var(--text-3);font-size:.65rem">${rowNum}</td>`;
            const maxCols = Math.max(_dataHeaders.length, row.length);
            for (let col = 0; col < maxCols; col++) {
                const val = row[col] || '';
                html += `<td class="ellipsis" ondblclick="editDataCell(this,${i},${col})" title="${esc(val)}" style="cursor:text">${esc(val)}</td>`;
            }
            html += `<td>${isAdmin && sheetId !== undefined ? `<button style="background:none;border:none;color:var(--c-danger);cursor:pointer;font-size:.8rem" onclick="deleteDataRow(${rowNum})" title="Удалить строку">✕</button>` : ''}</td></tr>`;
        });
        html += '</table></div></div>';
    }
    c.innerHTML = html;
}

function colToLetter(col) {
    let s = '';
    col++;
    while (col > 0) { col--; s = String.fromCharCode(65 + (col % 26)) + s; col = Math.floor(col / 26); }
    return s;
}

function editDataCell(td, rowIdx, colIdx) {
    const sheet   = _dataViewSheet;
    const row     = _dataRows[rowIdx];
    if (!sheet || !row) return;
    const cellRef = colToLetter(colIdx) + (rowIdx + 2);
    const oldVal  = row[colIdx] || '';
    const input = document.createElement('input');
    input.className = 'data-cell-edit';
    input.value = oldVal;
    td.textContent = '';
    td.appendChild(input);
    input.focus();
    input.select();
    const save = async () => {
        const newVal = input.value;
        td.textContent = newVal;
        if (newVal !== oldVal) {
            try { await apiUpdate(`${sheet}!${cellRef}`, newVal); row[colIdx] = newVal; td.title = newVal; toast('✓ Сохранено', 'ok'); }
            catch (e) { toast('Ошибка: ' + e.message, 'err'); td.textContent = oldVal; }
        }
    };
    input.addEventListener('blur', save);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); if (e.key === 'Escape') { td.textContent = oldVal; } });
}

async function addDataRow() {
    const name = _dataViewSheet;
    if (!name) return;
    const colCount = Math.max(_dataHeaders.length, 1);
    const emptyRow = Array(colCount).fill('');
    showLoader(true);
    try {
        await apiAppend(`${name}!A1`, [emptyRow]);
        toast('✓ Строка добавлена', 'ok');
        await openDataSheet(name);
    } catch (e) { toast('Ошибка: ' + e.message, 'err'); }
    showLoader(false);
}

async function deleteDataRow(rowNum) {
    const sheet   = _dataViewSheet;
    const sheetId = _dbSheetMeta?.get(sheet);
    if (!sheet || sheetId === undefined) return;
    if (!confirm(`Удалить строку ${rowNum}?`)) return;
    showLoader(true);
    try {
        await gasCall('deleteRows', { sheetId, startIndex: rowNum - 1, endIndex: rowNum });
        toast('✓ Строка удалена', 'ok');
        await openDataSheet(sheet);
    } catch (e) { toast('Ошибка: ' + e.message, 'err'); }
    showLoader(false);
}

async function createNewSheet() {
    const name = prompt('Имя нового листа (латиница, цифры, _):');
    if (!name) return;
    try { validateSheetName(name); } catch (e) { toast(e.message, 'err'); return; }
    showLoader(true);
    try {
        await gasCall('addSheets', { titles: [name] });
        await refreshDbCache();
        toast('✓ Лист создан: ' + name, 'ok');
        renderDataTab();
    } catch (e) { toast('Ошибка: ' + e.message, 'err'); }
    showLoader(false);
}

async function deleteCurrentSheet() {
    const name    = _dataViewSheet;
    const sheetId = _dbSheetMeta?.get(name);
    if (!name || sheetId === undefined) return;
    if (!confirm(`Удалить лист "${name}" полностью?`)) return;
    showLoader(true);
    try {
        await gasCall('deleteSheet', { sheetId });
        await refreshDbCache();
        _dataViewSheet = null;
        toast('✓ Лист удалён', 'ok');
        renderDataTab();
    } catch (e) { toast('Ошибка: ' + e.message, 'err'); }
    showLoader(false);
}

async function refreshDataSheets() {
    showLoader(true);
    try { await refreshDbCache(); renderDataTab(); toast('✓ Обновлено', 'ok'); }
    catch (e) { toast('Ошибка: ' + e.message, 'err'); }
    showLoader(false);
}

/* ── Settings: Cache Management ── */
function renderSettCache(c) {
    if (_cacheEditKey !== null) { renderCacheEditor(c); return; }

    const keys = Object.keys(localStorage).sort();
    _cacheKeys = keys;
    let totalBytes = 0;
    keys.forEach(k => totalBytes += ((localStorage.getItem(k) || '').length * 2));

    let html = `
        <div class="panel-sec">
            <h3>💾 Управление кэшем</h3>
            <div class="panel-row"><span>Всего ключей</span><span class="panel-badge">${keys.length}</span></div>
            <div class="panel-row"><span>Размер</span><span class="panel-badge">~${(totalBytes / 1024).toFixed(1)} КБ</span></div>
            <button class="panel-btn accent" onclick="createCacheKey()">+ Создать новый ключ</button>
            <button class="panel-btn" onclick="clearAppCache()">🧹 Очистить кэш приложений</button>
            <button class="panel-btn danger" onclick="resetAllData()">⚠️ Сбросить ВСЕ данные</button>
        </div>
        <div class="cache-list">`;
    keys.forEach((k, i) => {
        const val = localStorage.getItem(k) || '';
        const size = (val.length * 2);
        const sizeLabel = size < 1024 ? size + ' B' : (size / 1024).toFixed(1) + ' KB';
        html += `<div class="cache-item" onclick="openCacheKeyAt(${i})">
            <span class="cache-key">${esc(k)}</span>
            <span class="cache-size">${sizeLabel}</span>
            <span style="color:var(--text-3)">→</span>
        </div>`;
    });
    html += '</div>';
    c.innerHTML = html;
}

function openCacheKey(key) { _cacheEditKey = key; renderSettingsTab(); }
function openCacheKeyAt(i) { const k = _cacheKeys[i]; if (k !== undefined) openCacheKey(k); }

function renderCacheEditor(c) {
    const key = _cacheEditKey;
    const val = localStorage.getItem(key) || '';
    let formatted = val;
    try { formatted = JSON.stringify(JSON.parse(val), null, 2); } catch {}

    c.innerHTML = `
        <div class="data-back" onclick="closeCacheEditor()">← ${esc(key)}</div>
        <div class="cache-edit">
            <textarea class="cache-edit-ta" id="cache-val">${esc(formatted)}</textarea>
            <div class="cache-actions">
                <button class="cache-btn pr" onclick="saveCacheKey()">💾 Сохранить</button>
                <button class="cache-btn dn" onclick="deleteCacheKey()">🗑 Удалить</button>
                <button class="cache-btn" onclick="closeCacheEditor()">Отмена</button>
            </div>
        </div>`;
}

function closeCacheEditor() { _cacheEditKey = null; renderSettingsTab(); }

function saveCacheKey() {
    const key = _cacheEditKey;
    const val = $('cache-val').value;
    localStorage.setItem(key, val);
    toast('✓ Сохранено: ' + key, 'ok');
    closeCacheEditor();
}

function deleteCacheKey() {
    const key = _cacheEditKey;
    if (!confirm(`Удалить ключ "${key}"?`)) return;
    localStorage.removeItem(key);
    toast('✓ Удалён: ' + key, 'ok');
    closeCacheEditor();
}

function createCacheKey() {
    const key = prompt('Имя нового ключа:');
    if (!key || !key.trim()) return;
    if (localStorage.getItem(key.trim()) !== null) {
        openCacheKey(key.trim());
    } else {
        localStorage.setItem(key.trim(), '');
        openCacheKey(key.trim());
    }
}

function clearAppCache() {
    if (!confirm('Удалить сохранения, рекорды и настройки всех игр на этом устройстве? Аккаунт и избранное останутся.')) return;
    const keep = new Set([LS_CFG, LS_USER, LS_LAUNCHES, LS_PID, LS_FAVS, LS_GUEST]);
    for (const k of Object.keys(localStorage)) if (!keep.has(k)) localStorage.removeItem(k);
    if ('caches' in window) caches.keys().then(names => names.forEach(n => caches.delete(n)));
    toast('Кэш приложений очищен', 'ok');
    renderSettingsTab();
}

function resetAllData() {
    if (!confirm('Удалить ВСЕ данные платформы? Потребуется настройка заново.')) return;
    localStorage.clear();
    if ('caches' in window) caches.keys().then(names => names.forEach(n => caches.delete(n)));
    location.reload();
}

async function checkForUpdate() {
    if (!swRegistration) { toast('Service Worker не активен', ''); return; }
    showLoader(true);
    try {
        await swRegistration.update();
        showLoader(false);
        if (swRegistration.waiting) {
            toast('Обновление готово — перезагрузите', 'ok');
            swRegistration.waiting.postMessage({ type: 'SKIP_WAITING' });
        } else {
            toast('Версия актуальна', 'ok');
        }
        renderSettContent();
    } catch (e) { showLoader(false); toast('Ошибка: ' + e.message, 'err'); }
}

async function forceUpdateAll() {
    showLoader(true);
    try {
        if ('caches' in window) {
            const names = await caches.keys();
            await Promise.all(names.map(n => caches.delete(n)));
        }
        if (swRegistration) {
            await swRegistration.update();
            if (swRegistration.waiting) swRegistration.waiting.postMessage({ type: 'SKIP_WAITING' });
        }
        showLoader(false);
        toast('Кэши очищены — перезагружаю…', 'ok');
        setTimeout(() => location.reload(true), 800);
    } catch (e) { showLoader(false); toast('Ошибка: ' + e.message, 'err'); }
}

## Архитектура

Каждое приложение — это отдельный HTML-файл в папке \`apps/\`.
Приложение загружается внутри \`<iframe>\` с sandbox="allow-scripts allow-same-origin allow-modals allow-downloads" (работают confirm/alert и скачивание файлов).
Платформа предоставляет API через \`window.parent.PlatformAPI\`.
Все обращения к базе данных (Google Sheets) проходят через бэкенд на Google Apps Script.

## Доступ к PlatformAPI

\`\`\`javascript
const Platform = window.parent?.PlatformAPI || null;
if (!Platform) {
  // Приложение открыто вне платформы — показать заглушку
}
\`\`\`

## API: Пользователь

\`\`\`javascript

\`\`\`

## API: База данных (Google Sheets)

\`\`\`javascript

\`\`\`

## API: Очки и XP

## API: Логирование

## API: UI

\`\`\`

## Именование таблиц

Используйте префикс приложения: \`myapp_tablename\`.
Разрешены только: латиница, цифры, подчёркивание [a-zA-Z0-9_].

Примеры: \`dict_words\`, \`tetris_scores\`, \`trainer_sessions\`.

Системные таблицы \`sys_Users\`, \`sys_Logs\`, \`sys_Scores\` приложениям недоступны —
\`Platform.db.*\` отклоняет диапазоны с префиксом \`sys_\`. Очки отправляйте через \`Platform.gameplay.submitScore()\`.

## Регистрация приложения

Добавьте запись в \`apps/index.json\`:

function renderMarkdown(md) {
    return md
        .replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => `<pre>${esc(code.trim())}</pre>`)
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/^# (.+)$/gm, '<h4 style="font-size:1rem;margin-top:0">$1</h4>')
        .replace(/^## (.+)$/gm, '<h4>$1</h4>')
        .replace(/\n\n/g, '<br><br>')
        .replace(/\n/g, '<br>');
}

function updateUserUI() {
    const isGuest = !currentUser;
    const userLabel = currentUser ? (currentUser.name || currentUser.playerId || currentUser.login) : 'Гость';
    const xpBadge = currentUser ? `${currentUser.role === 'admin' ? '🔑 админ · ' : ''}⭐ ${fmt(currentUser.total_xp || 0)} XP` : 'без входа';

    $('hdr-user-name').textContent = userLabel;
    $('side-user-name').textContent = userLabel;
    const ini = currentUser ? initials(userLabel) : 'Г';
    ['side-avatar', 'hdr-avatar'].forEach(id => { const a = $(id); if (!a) return; a.textContent = ini; a.classList.toggle('guest', isGuest); });

    const sideXp = $('side-user-xp');
    if (sideXp) sideXp.textContent = xpBadge;

    const btnTitle = currentUser ? 'Выйти' : 'Войти';
    const btnIcon = currentUser
        ? '<svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="15" y1="12" x2="9" y2="12"/></svg>'
        : '<svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>';

    document.querySelectorAll('.btn-user-action').forEach(b => {
        b.title = btnTitle;
        b.innerHTML = btnIcon;
    });

    const restrictedTabs = ['board', 'data', 'settings'];
    document.querySelectorAll('.side-item, .bnav-item').forEach(btn => {
        if (restrictedTabs.includes(btn.dataset.tab)) {
            btn.style.display = isGuest ? 'none' : '';
        }
    });
    document.querySelectorAll('.side-sep').forEach(sep => {
        sep.style.display = isGuest ? 'none' : '';
    });
    document.querySelectorAll('[data-guest-only]').forEach(el => { el.style.display = isGuest ? '' : 'none'; });
    // гостю в шапке телефона хватает одной кнопки-профиля: она же ведёт на вход
    document.querySelectorAll('.plat-header .btn-user-action').forEach(el => { el.style.display = isGuest ? 'none' : ''; });

    if (isGuest && restrictedTabs.includes(activeTab)) {
        switchTab('apps');
    }
}

document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && appOpen()) { closeApp(); return; }
    // «/» — быстрый переход к поиску в каталоге
    if (e.key === '/' && !appOpen() && activeTab === 'apps' && $('v-platform').classList.contains('active') &&
        !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '')) {
        e.preventDefault();
        $('apps-search')?.focus();
    }
});

function handleUserAction() {

        doLogout();
    } else {
        showView('login');
    }
}

function doLogout() {
    if (!confirm('Выйти? Персональный ID сохранится на этом устройстве.')) return;
    if (currentUser?.token) gasCall('logout').catch(() => {});   // отозвать токен на сервере
    currentUser = null;
    saveUser();
    updateUserUI();
    toast('Вы вышли из аккаунта. Включён режим Гостя.', 'ok');
    switchTab('apps');
}

/* ══════════════════════════════════════════════════════════════════
 * AFTER LOGIN + INIT
 * ═════════════════════════════════════════════════════════════════ */
function afterLogin() {
    updateUserUI();
    showView('platform');
    switchTab('apps');
    fetchAndRenderApps();
    refreshDbCache().catch(() => {});
}

(function init() {
    loadCfg(); loadUser();
    // Сессия старого формата (без токена или без персонального ID) больше не действует — режим Гостя
    if (currentUser && (!currentUser.token || !currentUser.playerId)) { currentUser = null; saveUser(); }

    if (!cfg.gasUrl) {
        showView('setup');
    } else {
        afterLogin();
        refreshProfile();
    }
})();

 * SERVICE WORKER
 * ═════════════════════════════════════════════════════════════════ */
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
            .then(reg => {
                swRegistration = reg;
                reg.addEventListener('updatefound', () => {
                    const nw = reg.installing;
                    nw?.addEventListener('statechange', () => {
                        if (nw.state === 'installed' && navigator.serviceWorker.controller && !appOpen())
                            $('update-bar').classList.add('show');
                    });
                });
            })
            .catch(e => console.error('SW error:', e));
        navigator.serviceWorker.addEventListener('message', e => {
            if (e.data?.type === 'CACHE_UPDATED') toast('Файлы обновлены', 'ok');
        });
    });
}
