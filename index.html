<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KuApp</title>
    <meta name="description" content="KuApp — игры и приложения: аркады, головоломки, игры по сети, тренер и словарь.">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#070b24">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="KuApp">
    <link rel="icon" type="image/png" href="icon-256.png">
    <link rel="apple-touch-icon" href="icon-256.png">
    <link rel="preload" href="apps/fonts/rubik-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="apps/fonts/russo-one-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
    <style>
        /* ── ШРИФТЫ: локальные, те же, что в играх (apps/fonts, OFL) — работают офлайн ── */
        @font-face{font-family:'Russo One';font-style:normal;font-weight:400;font-display:swap;src:url(apps/fonts/russo-one-cyrillic.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
        @font-face{font-family:'Russo One';font-style:normal;font-weight:400;font-display:swap;src:url(apps/fonts/russo-one-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
        @font-face{font-family:'Rubik';font-style:normal;font-weight:300 900;font-display:swap;src:url(apps/fonts/rubik-cyrillic.woff2) format('woff2-variations'),url(apps/fonts/rubik-cyrillic.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
        @font-face{font-family:'Rubik';font-style:normal;font-weight:300 900;font-display:swap;src:url(apps/fonts/rubik-latin.woff2) format('woff2-variations'),url(apps/fonts/rubik-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

        /* ── TOKENS: «Неоновая аркада» — та же палитра, что в apps/ku-arcade.css ── */
        :root {
            --bg:#070b24;--bg2:#151038;--bg3:#0a2540;
            --surface:#0e1334;--surface-2:#161c45;--surface-3:#222a5e;
            --border:rgba(255,255,255,.08);--border-hi:rgba(255,255,255,.16);
            --text:#eef2ff;--text-2:#a8b1d8;--text-3:#7a85b4;
            --c-work:#51f58b;--c-rest:#ff9f43;--c-prep:#00e5ff;--c-finish:#ffd60a;--c-danger:#ff5d7d;
            --accent:#00e5ff;--accent-2:#ff4dd2;
            --grad:linear-gradient(135deg,#00e5ff 0%,#7aa2ff 60%,#c77dff 100%);
            --accent-soft:rgba(0,229,255,.12);--accent-line:rgba(0,229,255,.36);
            --radius:18px;--radius-sm:12px;--radius-xs:8px;--header-h:56px;
            --shadow:0 14px 40px rgba(0,0,0,.45);--shadow-sm:0 6px 18px rgba(0,0,0,.32);
            --glass:rgba(9,13,40,.74);
            --font:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
            --display:'Russo One','Rubik',system-ui,sans-serif;
            --mono:ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace;
            color-scheme:dark;
        }
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        [hidden]{display:none!important}
        html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
        body{font-family:var(--font);background:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 55%,var(--bg3) 100%) fixed;background-color:var(--bg);
            color:var(--text);height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;line-height:1.45;
            -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
        /* фон как в играх: светящиеся пятна + медленная сетка */
        body::before,body::after{content:'';position:fixed;pointer-events:none;z-index:-1}
        body::before{inset:-25vmax;background:
            radial-gradient(circle at 30% 30%,rgba(0,229,255,.11) 0,transparent 40vmax),
            radial-gradient(circle at 70% 68%,rgba(255,77,210,.085) 0,transparent 44vmax),
            radial-gradient(circle at 52% 20%,rgba(199,125,255,.06) 0,transparent 30vmax);
            animation:bgDrift 40s ease-in-out infinite alternate}
        body::after{inset:-64px;background-image:linear-gradient(rgba(255,255,255,.024) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.024) 1px,transparent 1px);
            background-size:64px 64px;animation:bgGrid 9s linear infinite}
        @keyframes bgDrift{to{transform:translate3d(5vmax,-4vmax,0) rotate(6deg)}}
        @keyframes bgGrid{to{transform:translate3d(64px,64px,0)}}
        @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
        @keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
        @keyframes floatY{50%{transform:translateY(-5px)}}
        button{font-family:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
        :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
        @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

        /* ── VIEWS ── */
        .view{display:none;flex:1;overflow:hidden;flex-direction:column;min-height:0}.view.active{display:flex}

        /* ── AUTH SCREENS ── */
        .auth-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
        .auth-card{width:100%;max-width:420px;margin:auto;background:linear-gradient(170deg,rgba(255,255,255,.075),rgba(255,255,255,.02)),var(--surface);border:1px solid var(--border-hi);border-radius:24px;padding:28px 24px 24px;display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow),0 0 60px rgba(0,229,255,.08);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:popIn .3s ease}
        .auth-logo{text-align:center;display:flex;flex-direction:column;align-items:center}
        .auth-logo-icon{width:68px;height:68px;border-radius:20px;background:var(--grad);display:grid;place-items:center;margin-bottom:12px;box-shadow:0 10px 30px rgba(0,229,255,.35)}
        .auth-logo-icon svg{width:36px;height:36px;stroke:#041018!important}
        .auth-logo-name{font-family:var(--display);font-size:1.9rem;font-weight:400;letter-spacing:.08em;background:linear-gradient(90deg,#00e5ff,#c77dff 55%,#ff4dd2);-webkit-background-clip:text;background-clip:text;color:transparent}
        .auth-logo-sub{font-size:.8rem;color:var(--text-2);margin-top:2px}
        .inp-group{display:flex;flex-direction:column;gap:6px}
        .inp-label{font-size:.74rem;color:var(--text-2);font-weight:600;letter-spacing:.02em}
        .inp-field{width:100%;padding:12px 14px;background:rgba(255,255,255,.05);border:1px solid var(--border-hi);border-radius:var(--radius-sm);color:var(--text);font-family:var(--font);font-size:1rem;outline:none;transition:border-color .15s,box-shadow .15s}
        .inp-field::placeholder{color:var(--text-3)}
        .inp-field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
        .inp-code{font-family:var(--mono);font-size:1.5rem;letter-spacing:.4em;text-align:center;padding:14px;text-indent:.4em}
        .inp-ta{resize:vertical;min-height:90px;font-family:var(--mono);font-size:.72rem;line-height:1.5}
        .btn-primary{width:100%;min-height:48px;padding:13px;background:var(--grad);color:#041018;border:none;border-radius:14px;font-family:var(--font);font-weight:700;font-size:1rem;cursor:pointer;transition:transform .12s,filter .15s,box-shadow .15s;box-shadow:0 8px 24px rgba(0,229,255,.28)}
        .btn-primary:hover{filter:brightness(1.06)}
        .btn-primary:active{transform:scale(.98)}
        .btn-secondary{width:100%;min-height:46px;padding:12px;background:rgba(255,255,255,.06);border:1px solid var(--border-hi);color:var(--text);border-radius:14px;font-family:var(--font);font-weight:600;font-size:.94rem;cursor:pointer;transition:background .15s,border-color .15s}
        .btn-secondary:hover{background:rgba(255,255,255,.1);border-color:var(--accent-line)}
        .btn-secondary.guest{background:rgba(0,229,255,.1);color:var(--accent);border-color:var(--accent-line)}
        .auth-err{font-size:.8rem;color:var(--c-danger);min-height:18px}
        .auth-link{font-size:.8rem;color:var(--accent);cursor:pointer;background:none;border:none;font-family:var(--font);text-align:center}
        .auth-link:hover{text-decoration:underline}
        .auth-sep{height:1px;background:var(--border)}
        .auth-hints{display:grid;grid-template-columns:1fr 1fr;gap:8px}
        .auth-hint{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:var(--radius-sm)}
        .auth-hint-ico{font-size:1.1rem;line-height:1.2}
        .auth-hint b{display:block;font-size:.76rem;color:var(--text)}
        .auth-hint span{font-size:.7rem;color:var(--text-2);line-height:1.4}
        .auth-note{font-size:.72rem;color:var(--text-3);text-align:center;line-height:1.5}
        @media(max-height:560px){
            .auth-scroll{padding:12px 16px}
            .auth-card{padding:16px 20px;gap:12px}
            .auth-logo{flex-direction:row;justify-content:center;gap:12px}
            .auth-logo-icon{width:44px;height:44px;border-radius:14px;margin:0}.auth-logo-icon svg{width:24px;height:24px}
            .auth-logo-name{font-size:1.4rem}.auth-logo-sub{display:none}
            .auth-hints,.auth-note{display:none}
        }
        @media(max-height:560px) and (min-width:640px){.auth-card{max-width:560px}}

        /* ── PLATFORM LAYOUT ── */
        .plat-layout{display:flex;flex:1;overflow:hidden;min-height:0}
        .sidebar{display:none;width:240px;flex-shrink:0;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-right:1px solid var(--border);flex-direction:column}
        .side-brand{padding:18px 18px 14px;font-family:var(--display);font-weight:400;font-size:1.2rem;display:flex;align-items:center;gap:10px;letter-spacing:.06em}
        .side-brand b{font-weight:400;background:linear-gradient(90deg,#00e5ff,#c77dff 60%,#ff4dd2);-webkit-background-clip:text;background-clip:text;color:transparent}
        .side-brand-icon,.brand-ico{width:34px;height:34px;border-radius:11px;background:var(--grad);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,229,255,.32);flex-shrink:0}
        .side-brand-icon svg,.brand-ico svg{width:18px;height:18px;stroke:#041018!important}
        .side-nav{flex:1;padding:6px 10px;display:flex;flex-direction:column;gap:3px;overflow-y:auto}
        .side-item{display:flex;align-items:center;gap:12px;min-height:44px;padding:10px 12px;border-radius:var(--radius-sm);border:none;background:none;color:var(--text-2);font:inherit;font-size:.9rem;font-weight:500;cursor:pointer;transition:background .15s,color .15s;text-align:left;width:100%;position:relative}
        .side-item:hover{background:rgba(255,255,255,.05);color:var(--text)}
        .side-item.active{background:var(--accent-soft);color:#fff}
        .side-item.active::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
        .side-item .ico{width:24px;height:24px;display:grid;place-items:center;flex-shrink:0;color:var(--text-3)}
        .side-item.active .ico,.side-item:hover .ico{color:var(--accent)}
        .side-sep{height:1px;background:var(--border);margin:8px 12px}
        .side-footer{padding:12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
        .side-user{flex:1;font-size:.84rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .side-xp{font-size:.68rem;color:var(--accent);font-weight:600}
        .avatar{width:36px;height:36px;border-radius:12px;background:var(--grad);color:#041018;display:grid;place-items:center;font-weight:700;font-size:.9rem;flex-shrink:0;letter-spacing:-.02em}
        .avatar.guest{background:rgba(255,255,255,.08);color:var(--text-2);border:1px solid var(--border-hi)}
        .avatar.sm{width:30px;height:30px;border-radius:10px;font-size:.78rem}

        .plat-main{display:flex;flex-direction:column;flex:1;overflow:hidden;min-width:0;min-height:0}
        .plat-header{display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);flex-shrink:0;min-height:var(--header-h);z-index:10;padding-top:env(safe-area-inset-top)}
        .brand-name{font-family:var(--display);font-size:1.25rem;letter-spacing:.08em;background:linear-gradient(90deg,#00e5ff,#c77dff 60%,#ff4dd2);-webkit-background-clip:text;background-clip:text;color:transparent}
        .plat-header:not(.on-apps) .brand-name{display:none}
        @media(max-width:767px){.plat-header.on-apps .plat-title{visibility:hidden}}
        .plat-title{flex:1;font-family:var(--display);font-size:1.02rem;font-weight:400;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .hdr-userchip{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;min-height:40px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--border);cursor:pointer;max-width:46vw}
        .hdr-user{font-size:.8rem;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .btn-icon{width:42px;height:42px;border-radius:13px;border:1px solid var(--border-hi);background:rgba(255,255,255,.06);color:var(--text-2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1.15rem;transition:background .15s,color .15s,border-color .15s,transform .12s}
        .btn-icon:hover{background:rgba(255,255,255,.1);color:var(--text);border-color:var(--accent-line)}
        .btn-icon:active{transform:scale(.94)}
        .btn-icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
        .btn-icon.accent{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft)}

        /* ── TAB PANELS ── */
        .tab-panel{display:none;flex:1;overflow:hidden;flex-direction:column;min-height:0}
        .tab-panel.active{display:flex}
        .tab-scroll{flex:1;overflow-y:auto;padding:0 0 24px;-webkit-overflow-scrolling:touch}

        /* ── BOTTOM NAV (mobile) ── */
        .bnav{display:flex;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--border);flex-shrink:0;padding:5px 6px;padding-bottom:max(5px,env(safe-area-inset-bottom))}
        .bnav-item{flex:1;min-width:0;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;color:var(--text-3);font-size:.66rem;font-weight:600;font-family:inherit;padding:3px 0 1px;cursor:pointer;transition:color .2s;white-space:nowrap}
        .bnav-item .ico{width:48px;height:28px;display:grid;place-items:center;border-radius:12px;transition:background .2s,box-shadow .2s}
        .bnav-item .ico svg{width:21px;height:21px}
        .bnav-item.active{color:var(--accent)}
        .bnav-item.active .ico{background:var(--accent-soft);box-shadow:0 0 14px rgba(0,229,255,.22)}

        @media(min-width:768px){
            .sidebar{display:flex}
            .bnav{display:none}
            .mob-only{display:none!important}
        }
        @media(min-width:1200px){
            .sidebar{width:264px}
        }
        /* Телефон в альбоме: вместо нижней панели и шапки — узкая рейка слева, всё место — каталогу */
        @media(orientation:landscape) and (max-height:520px){
            .sidebar{display:flex;width:64px;padding-left:env(safe-area-inset-left)}
            .bnav,.plat-header{display:none}
            .side-brand{padding:10px 0 6px;justify-content:center;font-size:0;gap:0}
            .side-nav{padding:4px 8px;align-items:center;gap:2px}
            .side-item{width:48px;min-height:44px;padding:0;justify-content:center;font-size:0;gap:0}
            .side-item.active::before{top:8px;bottom:8px}
            .side-sep{display:none}
            .side-footer{flex-direction:column;padding:6px 0 8px;gap:6px;border-top:none}
            .side-footer>div:not(.avatar){display:none!important}
            .side-footer .btn-icon{width:40px;height:40px}
            .side-footer .avatar{width:32px;height:32px;border-radius:10px;font-size:.78rem}
        }

        /* ── ХАБ: поиск, фильтры, «продолжить», карточки игр ── */
        #apps-scroll{flex:1;overflow-y:auto;padding:0 14px 28px;-webkit-overflow-scrolling:touch;scroll-padding-top:120px}
        .hub-bar{position:sticky;top:0;z-index:6;display:flex;flex-direction:column;gap:9px;margin:0 -14px 12px;padding:10px 14px 9px;
            background:linear-gradient(180deg,rgba(8,12,38,.96),rgba(8,12,38,.84));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
        .hub-search-row{display:flex;gap:8px;align-items:center}
        .search-input-wrap{position:relative;flex:1;min-width:0;display:flex;align-items:center}
        .search-input{width:100%;height:42px;padding:0 38px 0 40px;background:rgba(255,255,255,.06);border:1px solid var(--border-hi);border-radius:999px;color:var(--text);font-family:var(--font);font-size:1rem;outline:none;-webkit-appearance:none;appearance:none;background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23a8b1d8' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='11' cy='11' r='8'/%3E%3Cline x1='21' y1='21' x2='16.65' y2='16.65'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:14px center;transition:border-color .15s,box-shadow .15s}
        .search-input::placeholder{color:var(--text-3)}
        .search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
        .search-input::-webkit-search-cancel-button{display:none}
        .search-clear-btn{position:absolute;right:4px;width:34px;height:34px;border-radius:50%;background:transparent;border:none;color:var(--text-2);font-size:13px;cursor:pointer;display:none;align-items:center;justify-content:center}
        .search-clear-btn:hover{color:var(--text)}
        .chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:1px 14px 2px;margin:0 -14px}
        .chips::-webkit-scrollbar{display:none}
        .chip{flex-shrink:0;min-height:36px;padding:0 13px;border-radius:999px;background:rgba(255,255,255,.055);border:1px solid var(--border);color:var(--text-2);font-size:.8rem;font-weight:600;cursor:pointer;transition:background .15s,color .15s,border-color .15s,box-shadow .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
        .chip:hover{border-color:var(--accent-line);color:var(--text)}
        .chip.active{background:var(--accent-soft);color:var(--text);border-color:var(--accent);box-shadow:0 0 14px rgba(0,229,255,.25)}
        .chip .n{font-size:.68rem;color:var(--text-3);font-weight:500}
        .chip.active .n{color:var(--accent)}
        .chip-sep{flex:0 0 1px;align-self:center;height:20px;background:var(--border-hi)}

        .hero{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius);background:linear-gradient(135deg,rgba(0,229,255,.13),rgba(199,125,255,.09) 60%,rgba(255,77,210,.07));border:1px solid var(--border-hi);margin-bottom:12px;position:relative;overflow:hidden;animation:fadeUp .35s ease}
        .hero .avatar{width:42px;height:42px;border-radius:14px;font-size:1.05rem}
        .hero-body{flex:1;min-width:0}
        .hero-title{font-size:1rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .hero-sub{font-size:.76rem;color:var(--text-2);margin-top:2px;line-height:1.4}
        .hero-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
        .badge{display:inline-flex;align-items:center;gap:4px;font-size:.66rem;font-weight:600;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--text-2);border:1px solid var(--border);white-space:nowrap;line-height:1.3}
        .badge.net{background:rgba(81,245,139,.12);color:var(--c-work);border-color:rgba(81,245,139,.3)}
        .badge.duo{background:rgba(255,77,210,.1);color:#ff9be6;border-color:rgba(255,77,210,.3)}
        .badge.day{background:rgba(255,214,10,.1);color:#ffe38a;border-color:rgba(255,214,10,.3)}
        .badge.xp{background:rgba(255,214,10,.12);color:var(--c-finish);border-color:rgba(255,214,10,.3)}
        .badge.admin{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
        .hero-cta{flex-shrink:0;min-height:42px;padding:0 18px;border-radius:999px;background:var(--grad);color:#041018;border:none;font-weight:700;font-size:.88rem;cursor:pointer;box-shadow:0 8px 20px rgba(0,229,255,.3);transition:transform .12s,filter .15s;position:relative}
        .hero-cta:hover{filter:brightness(1.06)}.hero-cta:active{transform:scale(.97)}

        /* «Продолжить» — последняя игра */
        .continue{--c:#00e5ff;--c-a:rgba(0,229,255,.3);--c-b:rgba(0,229,255,.12);display:flex;align-items:center;gap:14px;padding:12px 14px 12px 12px;margin-bottom:16px;border-radius:20px;cursor:pointer;position:relative;overflow:hidden;
            background:radial-gradient(260px 160px at 0% 0%,var(--c-a),transparent 70%),linear-gradient(135deg,var(--c-b),rgba(255,255,255,.03));border:1px solid var(--c-a);box-shadow:var(--shadow-sm);animation:fadeUp .4s ease;transition:transform .12s,box-shadow .2s;user-select:none;-webkit-user-select:none}
        .continue:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.4),0 0 24px var(--c-b)}
        .continue:active{transform:scale(.985)}
        .continue-art{width:64px;height:64px;border-radius:18px;flex-shrink:0;display:grid;place-items:center;font-size:2.2rem;line-height:1;background:linear-gradient(160deg,var(--c-a),rgba(10,14,42,.6));border:1px solid var(--c-a);box-shadow:0 0 22px var(--c-b)}
        .continue-art span{animation:floatY 3.2s ease-in-out infinite;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
        .continue-body{flex:1;min-width:0}
        .continue-lbl{font-family:var(--display);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--c)}
        .continue-name{font-size:1.12rem;font-weight:700;line-height:1.2;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .continue-time{font-size:.72rem;color:var(--text-2);margin-top:2px}
        .continue-cta{flex-shrink:0;min-height:44px;padding:0 18px;display:inline-flex;align-items:center;gap:7px;border-radius:999px;background:var(--c);color:#041018;font-weight:700;font-size:.9rem;box-shadow:0 6px 20px var(--c-a)}

        .app-category{margin-bottom:20px}
        .app-cat-label{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:.86rem;font-weight:400;letter-spacing:.06em;color:var(--text);padding:0 2px 10px}
        .app-cat-count{font-family:var(--font);font-size:.68rem;font-weight:600;color:var(--text-3);background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:999px;padding:1px 8px;letter-spacing:0}
        .apps-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
        @media(min-width:520px){.apps-grid{grid-template-columns:repeat(auto-fill,minmax(164px,1fr));gap:12px}}
        @media(min-width:1100px){.apps-grid{grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:14px}}

        .g-card{--c:#00e5ff;--c-a:rgba(0,229,255,.3);--c-b:rgba(0,229,255,.12);position:relative;display:flex;flex-direction:column;min-width:0;border-radius:18px;overflow:hidden;cursor:pointer;text-align:left;
            background:linear-gradient(170deg,rgba(255,255,255,.075),rgba(255,255,255,.025));border:1px solid var(--border);box-shadow:var(--shadow-sm);
            transition:transform .16s,border-color .16s,box-shadow .2s;user-select:none;-webkit-user-select:none;animation:fadeUp .35s ease backwards;animation-delay:calc(var(--i,0)*22ms)}
        .g-card:hover{transform:translateY(-3px);border-color:var(--c-a);box-shadow:0 12px 30px rgba(0,0,0,.42),0 0 22px var(--c-b)}
        .g-card:active{transform:scale(.975)}
        .g-card:focus-visible{outline:2px solid var(--c);outline-offset:2px;border-radius:18px}
        .g-art{position:relative;height:82px;display:grid;place-items:center;overflow:hidden;
            background:radial-gradient(150px 90px at 50% 118%,var(--c-a),transparent 72%),linear-gradient(160deg,var(--c-b),rgba(8,12,38,.2) 80%);border-bottom:1px solid var(--border)}
        .g-art::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:18px 18px;
            -webkit-mask-image:linear-gradient(180deg,transparent,#000 90%);mask-image:linear-gradient(180deg,transparent,#000 90%)}
        .g-ico{position:relative;font-size:2.5rem;line-height:1;filter:drop-shadow(0 5px 12px rgba(0,0,0,.5));transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
        .g-ico.txt{font-family:var(--display);font-size:1.7rem;color:var(--c);text-shadow:0 0 18px var(--c)}
        @media(hover:hover){.g-card:hover .g-ico{transform:scale(1.14) rotate(-5deg)}}
        .g-info{padding:9px 11px 11px;display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
        .g-name{font-size:.94rem;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .g-desc{font-size:.72rem;color:var(--text-2);line-height:1.38;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .g-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto;padding-top:3px}
        .g-tags .badge{font-size:.62rem;padding:2px 7px}
        .g-fav{position:absolute;top:2px;right:2px;width:40px;height:40px;border:none;background:none;cursor:pointer;display:grid;place-items:center;color:rgba(255,255,255,.45);font-size:1.05rem;line-height:1;z-index:2;transition:transform .15s,color .15s}
        .g-fav::before{content:'';position:absolute;inset:6px;border-radius:50%;background:rgba(6,9,30,.5);z-index:-1}
        .g-fav:hover{color:#fff}.g-fav:active{transform:scale(.85)}
        .g-fav.on{color:var(--c-finish);text-shadow:0 0 10px rgba(255,214,10,.7)}

        /* Ряды «Избранное» и «Недавние» — компактные плитки с прокруткой вбок */
        .recent-row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px 14px 6px;margin:0 -14px;-webkit-overflow-scrolling:touch}
        .recent-row::-webkit-scrollbar{display:none}
        .recent-card{--c:#00e5ff;--c-a:rgba(0,229,255,.3);--c-b:rgba(0,229,255,.12);flex:0 0 auto;width:92px;display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 6px 9px;background:linear-gradient(170deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--border);border-radius:16px;cursor:pointer;text-align:center;transition:border-color .15s,transform .12s;user-select:none;-webkit-user-select:none}
        .recent-card:hover{border-color:var(--c-a);transform:translateY(-2px)}
        .recent-card:active{transform:scale(.96)}
        .recent-ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:1.6rem;line-height:1;background:linear-gradient(160deg,var(--c-a),rgba(10,14,42,.5));border:1px solid var(--c-a)}
        .recent-ico.txt{font-family:var(--display);font-size:1rem;color:var(--c)}
        .recent-name{font-size:.72rem;font-weight:600;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .recent-time{font-size:.62rem;color:var(--text-3)}
        .apps-empty{color:var(--text-2);font-size:.9rem;padding:40px 16px;text-align:center;line-height:1.5}
        .apps-empty b{display:block;font-size:2rem;margin-bottom:8px}
        .apps-foot{color:var(--text-3);font-size:.72rem;text-align:center;padding:6px 0 0}

        @media(min-width:600px){
            #apps-scroll{padding:0 20px 32px}
            .hub-bar{margin:0 -20px 14px;padding:12px 20px 10px}
            .chips{padding:1px 20px 2px;margin:0 -20px}
            .recent-row{padding:2px 20px 6px;margin:0 -20px}
            .hero{padding:14px 18px}
            .hero-title{font-size:1.1rem}
        }
        /* приветствие и «Продолжить» в один ряд, когда хватает ширины */
        @media(min-width:700px){
            .hub-duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;align-items:stretch;margin-bottom:16px}
            .hub-duo>*{margin-bottom:0}
            .hub-search-row{max-width:560px}
        }
        @media(max-width:359px){
            .hero-sub{display:none}
            .g-art{height:70px}.g-ico{font-size:2.1rem}
            .g-desc{font-size:.68rem}
            .continue-cta span{display:none}
        }
        /* Телефон в альбоме: панель поиска уезжает вместе с каталогом, всё компактнее */
        @media(orientation:landscape) and (max-height:520px){
            .hub-bar{position:static;flex-direction:row;align-items:center;gap:10px;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;border-bottom:none;padding-top:10px;padding-bottom:2px;margin-bottom:10px}
            .hub-search-row{flex:0 0 230px}
            .hub-bar .chips{flex:1;min-width:0;margin:0;padding:1px 0 2px}
            .hero{padding:8px 12px;margin-bottom:10px}
            .hero-sub{display:none}
            .hub-duo{display:grid;gap:10px;margin-bottom:12px}
            .continue{padding:8px 12px 8px 8px}
            .hub-duo>.continue,.hub-duo>.hero{margin-bottom:0}
            .continue-art{width:50px;height:50px;font-size:1.7rem;border-radius:14px}
            .continue-time{display:none}
            .apps-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
            .g-art{height:64px}.g-ico{font-size:2rem}
        }

        /* ── PANEL SECTIONS (cards) ── */
        .panel-sec{margin:12px 16px 0;padding:16px 18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
        .panel-sec:last-child{margin-bottom:12px}
        .panel-sec h3{font-family:var(--display);font-size:.72rem;font-weight:400;color:var(--text-2);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
        .panel-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;font-size:.84rem;color:var(--text-2);border-bottom:1px dashed var(--border)}
        .panel-row:last-of-type{border-bottom:none}
        .panel-badge{font-size:.72rem;background:var(--surface-2);border:1px solid var(--border-hi);border-radius:999px;padding:3px 10px;color:var(--text);font-family:var(--mono);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .panel-btn{width:100%;min-height:44px;padding:11px 14px;margin-top:8px;border-radius:var(--radius-sm);border:1px solid var(--border-hi);background:var(--surface-2);color:var(--text);font:inherit;font-size:.84rem;font-weight:700;cursor:pointer;text-align:left;transition:background .15s,border-color .15s;display:block}
        .panel-btn:hover{background:var(--surface-3);border-color:var(--accent-line)}
        .panel-btn.accent{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
        .panel-btn.danger{color:var(--c-danger);border-color:rgba(255,93,125,.3)}

        /* ── DATA TABLE ── */
        .table-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface)}
        .data-table{width:100%;border-collapse:collapse;font-size:.76rem;min-width:480px}
        .data-table th{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text-3);font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;background:var(--surface-2);position:sticky;top:0}
        .data-table td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--text-2)}
        .data-table tr:last-child td{border-bottom:none}
        .data-table td.nowrap{white-space:nowrap}
        .data-table td.ellipsis{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .data-table tr:hover td{background:rgba(255,255,255,.025)}

        /* ── ADMIN USERS ── */
        .users-list{display:flex;flex-direction:column;gap:6px}
        .user-row{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:.82rem;flex-wrap:wrap}
        .u-email{font-weight:700;flex:1;min-width:120px}
        .u-role{font-size:.64rem;font-weight:700;background:var(--surface-3);padding:3px 9px;border-radius:999px;color:var(--text-2)}
        .u-role.admin{background:var(--accent-soft);color:var(--accent)}
        .u-meta{width:100%;font-size:.65rem;color:var(--text-3);margin-top:2px}
        .u-actions{display:flex;gap:4px}
        .u-actions button{min-height:36px;padding:5px 12px;border-radius:999px;border:1px solid var(--border-hi);background:var(--surface-3);color:var(--text-2);font:inherit;font-size:.7rem;font-weight:700;cursor:pointer;transition:background .15s}
        .u-actions button:hover{background:var(--surface-2);color:var(--text)}

        /* ── LOGS FILTERS ── */
        .logs-filters{display:flex;gap:8px;padding:0 16px 12px;flex-shrink:0;flex-wrap:wrap}
        .logs-filters select{min-height:42px;padding:9px 12px;background:var(--surface-2);border:1px solid var(--border-hi);border-radius:var(--radius-sm);color:var(--text);font:inherit;font-size:.82rem;outline:none;flex:1;min-width:120px}
        .logs-info{padding:6px 16px;font-size:.68rem;color:var(--text-3)}

        /* ── LEADERBOARD ── */
        .board-list{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
        .board-item{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;transition:border-color .15s}
        .board-item:hover{border-color:var(--border-hi)}
        .board-item.self{border-color:var(--accent-line);background:linear-gradient(135deg,var(--accent-soft),var(--surface-2))}
        .board-head{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;transition:background .15s}
        .board-pos{width:34px;height:34px;border-radius:12px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.84rem;flex-shrink:0;font-family:var(--mono)}
        .board-pos.top1{background:var(--c-finish);color:#041018}
        .board-pos.top2{background:#c8ccd8;color:#041018}
        .board-pos.top3{background:#d08a4a;color:#041018}
        .board-info{flex:1;min-width:0}
        .board-name{font-size:.88rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .board-meta{font-size:.66rem;color:var(--text-3);margin-top:2px}
        .board-time{font-size:1rem;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;flex-shrink:0;text-align:right}
        .board-time small{font-size:.6rem;font-weight:400;color:var(--text-2)}
        .board-expand{display:none;padding:0 14px 12px;border-top:1px solid var(--border)}
        .board-expand.open{display:block}
        .board-app-row{display:flex;justify-content:space-between;padding:7px 0;font-size:.78rem;color:var(--text-2);border-bottom:1px dashed var(--border)}
        .board-app-row:last-child{border-bottom:none}
        .role-tag{font-size:.55rem;background:var(--accent-soft);color:var(--accent);padding:1px 7px;border-radius:999px;vertical-align:middle;margin-left:6px;font-weight:800}
        .empty-state{padding:48px 20px;text-align:center;color:var(--text-2);font-size:.9rem;line-height:1.5}
        .empty-ico{font-size:2.2rem;margin-bottom:10px}

        /* ── STAT CARDS ── */
        .stat-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;padding:14px 16px}
        .stat-card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 12px;text-align:center}
        .stat-card-val{font-size:1.35rem;font-weight:800;letter-spacing:-.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
        .stat-card-lbl{font-size:.66rem;color:var(--text-3);margin-top:4px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}

        /* ── SETTINGS SUB-TABS (segmented) ── */
        .sett-tabs{display:flex;gap:6px;padding:12px 16px 4px;flex-shrink:0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
        .sett-tabs::-webkit-scrollbar{display:none}
        .sett-tab{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 14px;font-size:.78rem;font-weight:700;color:var(--text-2);cursor:pointer;border:1px solid var(--border);background:var(--surface-2);border-radius:999px;white-space:nowrap;transition:all .15s;font-family:inherit}
        .sett-tab svg{width:15px;height:15px;stroke:currentColor;flex-shrink:0}
        .sett-tab:hover{color:var(--text);border-color:var(--accent-line)}
        .sett-tab.active{color:#041018;background:var(--grad);border-color:transparent;box-shadow:0 6px 16px rgba(0,229,255,.25)}
        .sett-tab.active svg{stroke:#041018}

        /* ── CACHE EDITOR ── */
        .cache-list{display:flex;flex-direction:column;gap:4px;padding:12px 16px}
        .cache-item{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:.78rem;cursor:pointer;transition:background .15s,border-color .15s}
        .cache-item:hover{background:var(--surface-3);border-color:var(--border-hi)}
        .cache-key{flex:1;font-weight:600;font-family:var(--mono);font-size:.72rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .cache-size{font-size:.62rem;color:var(--text-3);font-family:var(--mono);flex-shrink:0}
        .cache-edit{display:flex;flex-direction:column;gap:8px;padding:12px 16px}
        .cache-edit-ta{width:100%;min-height:200px;background:var(--surface-2);border:1px solid var(--border-hi);border-radius:var(--radius-sm);color:var(--text);font-family:var(--mono);font-size:.72rem;line-height:1.5;padding:10px;resize:vertical;outline:none}
        .cache-edit-ta:focus{border-color:var(--accent)}
        .cache-actions{display:flex;gap:8px;flex-wrap:wrap}
        .cache-btn{min-height:40px;padding:9px 16px;border-radius:999px;border:1px solid var(--border-hi);background:var(--surface-2);color:var(--text);font:inherit;font-size:.78rem;font-weight:700;cursor:pointer;transition:all .15s}
        .cache-btn:hover{background:var(--surface-3);border-color:var(--accent-line)}
        .cache-btn.pr{background:var(--grad);border-color:transparent;color:#041018}
        .cache-btn.dn{color:var(--c-danger);border-color:rgba(255,93,125,.3)}

        /* ── DATA BROWSER ── */
        .data-sheets{display:flex;flex-direction:column;gap:4px;padding:12px 16px}
        .data-sheet-group{margin-bottom:12px}
        .data-sheet-group-title{font-size:.64rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-3);padding:0 2px 8px;font-weight:800}
        .data-sheet-item{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-size:.84rem;transition:all .15s;margin-bottom:6px}
        .data-sheet-item:hover{background:var(--surface-3);border-color:var(--accent-line)}
        .data-sheet-item .ico{flex-shrink:0}
        .data-sheet-name{flex:1;font-weight:700}
        .data-sheet-arrow{color:var(--text-3);flex-shrink:0}
        .data-back{display:flex;align-items:center;gap:6px;padding:12px 16px;font-size:.84rem;font-weight:700;color:var(--accent);cursor:pointer;border-bottom:1px solid var(--border)}
        .data-back:hover{background:rgba(255,255,255,.03)}
        .data-toolbar{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;flex-shrink:0}
        .data-toolbar .cache-btn{padding:6px 12px;font-size:.72rem}
        .data-cell-edit{background:var(--surface-2);border:1px solid var(--accent);border-radius:4px;color:var(--text);font-family:var(--mono);font-size:.72rem;padding:4px 6px;width:100%;min-width:60px;outline:none}

        /* ── DEV GUIDE ── */
        .devguide{padding:16px;font-size:.8rem;line-height:1.7;color:var(--text-2)}
        .devguide pre{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;overflow-x:auto;margin:8px 0;font-family:var(--mono);font-size:.68rem;line-height:1.5;color:var(--text);white-space:pre-wrap;word-break:break-word}
        .devguide h4{color:var(--text);font-size:.9rem;margin:16px 0 6px;font-weight:800}
        .devguide code{background:var(--surface-2);padding:1px 6px;border-radius:4px;font-family:var(--mono);font-size:.72rem}
        .copy-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;background:var(--grad);color:#041018;border:none;font:inherit;font-size:.78rem;font-weight:800;cursor:pointer;transition:filter .15s;margin:8px 0}
        .copy-btn:hover{filter:brightness(1.06)}

        /* ── СОСТОЯНИЯ: пусто / ошибка с повтором ── */
        .retry-btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;margin-top:14px;padding:0 20px;border-radius:999px;border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent);font:inherit;font-size:.88rem;font-weight:600;cursor:pointer}
        .retry-btn:hover{background:rgba(0,229,255,.2)}
        .apps-body.quiet .g-card,.apps-body.quiet .hero,.apps-body.quiet .continue{animation:none}

        /* ── IMMERSIVE CONTAINER ── */
        #immersive-container{display:none;position:fixed;inset:0;z-index:9999;background:var(--bg)}
        #immersive-container.open{display:block}
        #app-iframe{width:100%;height:100%;border:none;display:block;background:var(--bg)}
        /* Кнопка «←»: игры резервируют под неё левый верхний угол 64×64 — положение и размер не менять */
        #btn-float-back{position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;width:44px;height:44px;border-radius:14px;background:rgba(9,13,40,.74);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);color:var(--text);font-size:1.3rem;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10000;transition:background .2s,transform .1s,border-color .2s;box-shadow:0 6px 16px rgba(0,0,0,.45)}
        #btn-float-back:hover{background:rgba(34,42,94,.9);border-color:var(--accent-line)}
        #btn-float-back:active{transform:scale(.92)}
        /* Заставка, пока игра загружается */
        #app-splash{--c:#00e5ff;--c-a:rgba(0,229,255,.3);--c-b:rgba(0,229,255,.12);position:absolute;inset:0;z-index:9995;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;pointer-events:none;
            background:radial-gradient(60vmax 40vmax at 50% 45%,var(--c-b),transparent 70%),linear-gradient(160deg,var(--bg) 0%,var(--bg2) 55%,var(--bg3) 100%);transition:opacity .26s ease}
        #app-splash.hide{opacity:0}
        .splash-ico{width:104px;height:104px;border-radius:30px;display:grid;place-items:center;font-size:3.4rem;line-height:1;background:linear-gradient(160deg,var(--c-a),rgba(10,14,42,.6));border:1px solid var(--c-a);box-shadow:0 0 50px var(--c-b),0 18px 40px rgba(0,0,0,.45);animation:floatY 1.8s ease-in-out infinite}
        .splash-ico.txt{font-family:var(--display);font-size:2.2rem;color:var(--c)}
        .splash-name{font-family:var(--display);font-size:1.35rem;letter-spacing:.08em;text-align:center;padding:0 20px}
        .splash-bar{width:120px;height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
        .splash-bar i{display:block;width:40%;height:100%;border-radius:2px;background:var(--c);box-shadow:0 0 10px var(--c);animation:splashRun 1s ease-in-out infinite}
        @keyframes splashRun{0%{transform:translateX(-110%)}100%{transform:translateX(310%)}}

        /* ── TOAST ── */
        #toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(6px);background:rgba(8,12,38,.96);border:1px solid var(--border-hi);color:var(--text);padding:10px 18px;border-radius:16px;font-size:.86rem;font-weight:500;line-height:1.35;z-index:10001;pointer-events:none;transition:opacity .25s,transform .25s;opacity:0;width:max-content;max-width:min(92vw,520px);text-align:center;box-shadow:var(--shadow)}
        #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
        #toast.ok{border-color:rgba(81,245,139,.5);color:#a6ffc4}
        #toast.err{border-color:rgba(255,93,125,.5);color:#ff9fb1}
        @media(min-width:768px){#toast{bottom:28px}}
        @media(orientation:landscape) and (max-height:520px){#toast{bottom:16px}}

        /* ── ПОЛОСКА «ДОСТУПНО ОБНОВЛЕНИЕ» ── */
        #update-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:10002;display:none;align-items:center;gap:12px;padding:7px 7px 7px 16px;border-radius:999px;background:rgba(8,12,38,.97);border:1px solid var(--accent-line);box-shadow:var(--shadow),0 0 24px rgba(0,229,255,.18);font-size:.86rem;white-space:nowrap}
        #update-bar.show{display:flex;animation:fadeUp .3s ease}
        #update-bar button{min-height:38px;padding:0 16px;border-radius:999px;border:none;background:var(--grad);color:#041018;font:inherit;font-weight:700;cursor:pointer}
        @media(min-width:768px){#update-bar{bottom:28px}}

        /* ── LOADER ── */
        #loader{position:fixed;inset:0;background:rgba(5,8,26,.78);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:20000;flex-direction:column;gap:12px}
        #loader.show{display:flex}
        .loader-spin{width:38px;height:38px;border:3px solid var(--border-hi);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}

        ::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border-hi);border-radius:3px}
    </style>
</head>

let currentUser    = null;

let searchQuery    = '';
let currentSession = { appId: null, startTime: null };
let swRegistration = null;

/* ══════════════════════════════════════════════════════════════════
 * UTILS
 * ═════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
/** Экранирует текст для HTML, включая кавычки — безопасно и в атрибутах. */
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, ch => ESC_MAP[ch]); }
function fmt(n) { return (n || 0).toLocaleString('ru-RU'); }

function toast(msg, type = '') {
    const el = $('toast');
    el.textContent = msg;
    el.className = 'show' + (type ? ' ' + type : '');
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.className = ''; }, Math.min(6000, 2600 + String(msg).length * 30));
}

function showLoader(on) { $('loader').classList.toggle('show', !!on); }

function formatTs(ts) {
    try { return new Date(ts).toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }); }
    catch { return ts || ''; }
}

function formatDuration(sec) {
    sec = Math.round(sec);
    if (sec < 60) return sec + ' сек';
    const m = Math.floor(sec / 60);
    if (m < 60) return m + ' мин ' + (sec % 60 ? (sec % 60) + ' сек' : '');
    const h = Math.floor(m / 60);
    return h + ' ч ' + (m % 60 ? (m % 60) + ' мин' : '');
}

function formatRelative(ts) {
    if (!ts) return '';
    const diff = Date.now() - ts;
    const sec = Math.floor(diff / 1000);
    if (sec < 60) return 'только что';
    const min = Math.floor(sec / 60);
    if (min < 60) return min + ' мин. назад';
    const hr = Math.floor(min / 60);
    if (hr < 24) return hr + ' ч. назад';
    const days = Math.floor(hr / 24);
    if (days === 1) return 'вчера';
    return days + ' дн. назад';
}

/* ══════════════════════════════════════════════════════════════════
 * GAS PROXY — все обращения к БД идут через Google Apps Script
 * ═════════════════════════════════════════════════════════════════ */
async function gasCall(action, params = {}, timeoutMs = 25000) {
    if (!cfg.gasUrl) throw new Error('GAS URL не настроен');
    const body = { action, params };
    if (currentUser?.token) body.token = currentUser.token;   // токен сессии (см. gas/Code.gs → AUTH)
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), timeoutMs);
    let r, text;
    try {
        r = await fetch(cfg.gasUrl, { method: 'POST', body: JSON.stringify(body), signal: ctl.signal });
        text = await r.text();
    } catch (e) {
        if (e && e.name === 'AbortError') throw new Error('Сервер не отвечает — попробуйте ещё раз');
        throw new Error(navigator.onLine === false ? 'Нет подключения к интернету' : 'Нет связи с сервером');
    } finally { clearTimeout(timer); }
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    let d;
    // при превышении квоты GAS отдаёт HTML-страницу со статусом 200
    try { d = JSON.parse(text); } catch { throw new Error('Сервер вернул неожиданный ответ — попробуйте позже'); }
    if (!d.ok) {
        if (d.code === 'AUTH_EXPIRED' && currentUser) onSessionExpired();
        throw new Error(d.error || 'Ошибка GAS');
    }
    return d.data;
}

/** Сервер отверг токен — сбрасываем локальную сессию. */
function onSessionExpired() {
    currentUser = null;
    saveUser();
    updateUserUI();
    toast('Сессия истекла — войдите снова', 'err');
}

async function apiRead(range)          { return gasCall('read', { range }); }
async function apiAppend(range, values) { return gasCall('append', { range, values }); }
async function apiUpdate(range, values) { return gasCall('update', { range, values }); }
async function apiBatchValues(data)     { return gasCall('batchValues', { data }); }

/* ══════════════════════════════════════════════════════════════════
 * SHEET NAME VALIDATION & DB CACHE
 * ═════════════════════════════════════════════════════════════════ */
function validateSheetName(name) {
    if (!/^[a-zA-Z0-9_]+$/.test(name)) {
        throw new Error('Недопустимое имя таблицы: ' + name + '. Разрешены только буквы, цифры и _');
    }
}
function isSysSheet(name) { return /^sys_/i.test(String(name || '')); }
/** Проверка диапазона для PlatformAPI.db: системные листы приложениям недоступны. */
function validateSheetRange(range) {
    const sheetName = String(range || '').split('!')[0];
    validateSheetName(sheetName);
    if (isSysSheet(sheetName)) throw new Error('Системные таблицы (sys_*) недоступны приложениям');
}
async function refreshDbCache() {
    const result = await gasCall('meta');
    const sheets = result.sheets || [];
    _dbSheetCache = new Set(sheets.map(s => s.title));
    _dbSheetMeta = new Map(sheets.map(s => [s.title, s.sheetId]));
    return _dbSheetCache;
}

/* ══════════════════════════════════════════════════════════════════
 * DB INITIALIZATION — ensureTables
 * ═════════════════════════════════════════════════════════════════ */
async function dbEnsureTables(tablesConfig) {
    for (const t of tablesConfig) validateSheetName(t.name);
    if (!_dbSheetCache) await refreshDbCache();
    const missing = tablesConfig.filter(t => !_dbSheetCache.has(t.name));
    if (!missing.length) return;
    await gasCall('addSheets', { titles: missing.map(t => t.name) });
    for (const t of missing) {
        try { await apiAppend(`${t.name}!A1`, [t.headers]); } catch {}
        _dbSheetCache.add(t.name);
    }
    await refreshDbCache();
}

async function dbInitAllSheets() {
    const systemTables = Object.entries(DB_SYSTEM_SCHEMA).map(([name, desc]) => ({
        name, headers: desc.headers
    }));
    await dbEnsureTables(systemTables);
}

/* ══════════════════════════════════════════════════════════════════
 * GUEST SCORE & IDENTITY
 * Гость в журнале — «Гость XXXXXX» со случайным идентификатором из localStorage.
 * IP-адрес и город не запрашиваются и никуда не пишутся.
 * ═════════════════════════════════════════════════════════════════ */
const ID_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
let _guestIdMem = '';
function randomId(n) {
    let s = '';
    const buf = new Uint32Array(n);
    try { crypto.getRandomValues(buf); } catch { for (let i = 0; i < n; i++) buf[i] = Math.floor(Math.random() * 4294967296); }
    for (let i = 0; i < n; i++) s += ID_CHARS[buf[i] % ID_CHARS.length];
    return s;
}
function getGuestId() {
    try {
        let id = localStorage.getItem(LS_GUEST);
        if (!/^[A-Z2-9]{6}$/.test(id || '')) { id = randomId(6); localStorage.setItem(LS_GUEST, id); }
        return id;
    } catch { return _guestIdMem || (_guestIdMem = randomId(6)); }
}
async function getGuestIdentity() { return currentUser ? currentUser.login : 'Гость ' + getGuestId(); }

/** Имя для показа в статистике и рейтинге: в старых записях гостей был IP-адрес — его видит только администратор. */
function displayUser(u) {
    const s = String(u || '?');
    if ((currentUser?.role || '').toLowerCase() === 'admin') return s;
    const m = /^Гость\s*\((.+)\)$/.exec(s);
    if (!m) return s;
    let h = 0;
    for (const ch of m[1]) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return 'Гость #' + (h % 65536).toString(16).toUpperCase().padStart(4, '0');
}

function getGuestScores() {
    try { return JSON.parse(localStorage.getItem('mcg_guest_scores') || '{}'); } catch { return {}; }
}
function saveGuestScore(appId, rawScore, xpEarned) {
    try {
        const d = getGuestScores();
        const prev = d[appId] || { score: 0, xp: 0 };
        if (rawScore > prev.score) {
            d[appId] = { score: rawScore, xp: (prev.xp || 0) + (xpEarned || 0), ts: Date.now() };
        } else {
            d[appId] = { ...prev, xp: (prev.xp || 0) + (xpEarned || 0) };
        }
        localStorage.setItem('mcg_guest_scores', JSON.stringify(d));
    } catch {}
}
function getGuestTotalXP() {
    const d = getGuestScores();
    return Object.values(d).reduce((s, x) => s + (x.xp || 0), 0);
}

/* ══════════════════════════════════════════════════════════════════
 * PLATFORM API (accessible from iframes via window.parent.PlatformAPI)
 * ═════════════════════════════════════════════════════════════════ */
window.PlatformAPI = {
    user: {
        getProfile: () => currentUser
            ? { login: currentUser.login, playerId: currentUser.playerId, name: currentUser.name || '', role: currentUser.role, total_xp: currentUser.total_xp, isGuest: false }
            : { login: 'Гость', playerId: '', name: '', role: 'guest', total_xp: getGuestTotalXP(), isGuest: true },
        isAdmin: () => (currentUser?.role || '').toLowerCase() === 'admin',
        isGuest: () => !currentUser,
        getRole: () => (currentUser ? (currentUser.role || 'player') : 'guest').toLowerCase(),
        getToken: () => currentUser?.token || null      // для сетевых комнат (kunet.js)
    },
    db: {
        read: async (range) => { validateSheetRange(range); return apiRead(range); },
        append: async (range, values) => { validateSheetRange(range); return apiAppend(range, values); },
        update: async (range, values) => { validateSheetRange(range); return apiUpdate(range, values); },
        batchValues: async (data) => {
            if (Array.isArray(data)) data.forEach(d => { if (d.range) validateSheetRange(d.range); });
            return apiBatchValues(data);
        },
        ensureTables: async (tablesConfig) => {
            (tablesConfig || []).forEach(t => { if (isSysSheet(t.name)) throw new Error('Системные таблицы (sys_*) недоступны приложениям'); });
            showLoader(true);
            try { await dbEnsureTables(tablesConfig); toast('✓ Таблицы готовы', 'ok'); }
            catch (e) { toast('Ошибка БД: ' + e.message, 'err'); throw e; }
            finally { showLoader(false); }
        },
        getGasUrl: () => cfg.gasUrl
    },
    gameplay: {
        submitScore: async (appId, rawScore, xpEarned) => {
            if (!currentUser) {
                saveGuestScore(appId, rawScore, xpEarned);
                const guestUser = await getGuestIdentity();
                apiAppend('sys_Logs!A:E', [[new Date().toISOString(), guestUser, appId, 'guest_score', `Score: ${rawScore}, XP: ${xpEarned}`]]).catch(() => {});
                // подсказка про вход — один раз за запуск, чтобы не мешать в быстрых играх
                if (!window._guestHintShown) {
                    window._guestHintShown = true;
                    toast(`🎮 Результат: ${rawScore}. Войдите по коду, чтобы попасть в общий рейтинг.`, 'ok');
                }
                return;
            }
            // Сервер сам пишет sys_Scores и прибавляет XP строке пользователя (по логину из токена)
            try {
                const res = await gasCall('addXP', { appId, rawScore, xp: xpEarned });
                if (currentUser) { currentUser.total_xp = res.total_xp; saveUser(); updateUserUI(); }
                toast(`🏆 Очки сохранены: ${rawScore} (+${xpEarned} XP)`, 'ok');
            } catch (e) {
                toast('Не удалось сохранить очки: ' + e.message, 'err');
            }
        }
    },
    system: {
        logSession: async (appId, durationSec) => {
            const u = await getGuestIdentity();
            try { await apiAppend('sys_Logs!A:E', [[new Date().toISOString(), u, appId, 'session', String(durationSec)]]); } catch {}
        },
        log: async (appId, eventType, details) => {
            const u = await getGuestIdentity();
            try { await apiAppend('sys_Logs!A:E', [[new Date().toISOString(), u, appId, eventType, String(details || '')]]); } catch {}
        }
    },
    ui: {
        showToast:  (msg, type) => toast(msg, type),
        showLoader: (on)        => showLoader(on),
        openSettings: ()        => switchTab('settings'),
        openLogin: ()           => { closeApp(); showView('login'); }
    }
};
